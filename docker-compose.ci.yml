# CI overlay for the compose smoke job (#484, #533). Throwaway secrets, tls
# internal, one fixture house on the stack Mosquitto. Live commands on against
# that broker only. Caddy is the only published port. Production compose is
# unchanged.
# Replica counts are DASHBOARD_REPLICAS, DISPATCHER_REPLICAS, and
# AUTONOMY_MCP_REPLICAS (smoke sets each to 2; production compose defaults 1).
services:
  caddy:
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes: !override
      - ./Caddyfile.smoke:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - /opt/freedriver-storage/caddy/data:/data
      - /opt/freedriver-storage/caddy/config:/config
    depends_on: !override
      - keycloak
      - twilio-stub
    networks:
      default:
        aliases:
          - app.freedriver.io
          - auth.freedriver.io
          - grafana.freedriver.io
          - mqtt.freedriver.io
          - www.freedriver.io
          - freedriver.io
          - verify.twilio.com

  dashboard:
    pull_policy: missing
    deploy:
      replicas: ${DASHBOARD_REPLICAS:-2}
    environment:
      FREEDRIVER_APPLIANCES_LIVE_COMMANDS: "true"
      FREEDRIVER_APPLIANCES_ENABLED: "true"
      QUARKUS_TLS_TRUST_ALL: "true"
      # House list interpolates quarkus.keycloak.admin-client.server-url from this.
      # -D uses the exact property names; env mapping can miss the hyphenated key.
      FREEDRIVER_KEYCLOAK_SERVER_URL: http://keycloak:8080
      QUARKUS_KEYCLOAK_ADMIN_CLIENT_SERVER_URL: http://keycloak:8080
      # Invite SPI is a frontend realm resource. Token iss is KC_HOSTNAME
      # (https://auth.freedriver.io). hostname-strict is ignored when hostname
      # is set, so an HTTP compose POST 302s to HTTPS and the rest-client
      # follows it as GET (405). Call the public host through Caddy.
      QUARKUS_TLS_SMOKE_TRUST_ALL: "true"
      QUARKUS_TLS_SMOKE_HOSTNAME_VERIFICATION_ALGORITHM: "NONE"
      QUARKUS_REST_CLIENT_KEYCLOAK_INVITE_URL: https://auth.freedriver.io
      QUARKUS_REST_CLIENT_KEYCLOAK_INVITE_TLS_CONFIGURATION_NAME: smoke
      JAVA_OPTS_APPEND: "-Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager -Dquarkus.keycloak.admin-client.server-url=http://keycloak:8080 -Dfreedriver.keycloak.server-url=http://keycloak:8080 -Dquarkus.tls.smoke.trust-all=true -Dquarkus.tls.smoke.hostname-verification-algorithm=NONE -Dquarkus.rest-client.keycloak-invite.url=https://auth.freedriver.io -Dquarkus.rest-client.keycloak-invite.tls-configuration-name=smoke -Xmx512m"

  agent-dispatcher:
    pull_policy: missing
    deploy:
      replicas: ${DISPATCHER_REPLICAS:-2}
    environment:
      QUARKUS_TLS_TRUST_ALL: "true"
      JAVA_OPTS_APPEND: "-Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager -Xmx256m"

  autonomy-mcp:
    pull_policy: missing
    deploy:
      replicas: ${AUTONOMY_MCP_REPLICAS:-2}
    environment:
      FREEDRIVER_MCP_ENABLED: "true"
      QUARKUS_TLS_TRUST_ALL: "true"
      JAVA_OPTS_APPEND: "-Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager -Xmx256m"

  keycloak:
    pull_policy: missing
    ports: !reset []
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD is required}
      KC_HOSTNAME: https://auth.freedriver.io
      KC_HOSTNAME_ADMIN: http://127.0.0.1:8080
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_APPEND: "-Xms256m -Xmx768m"

  grafana:
    profiles: ["observability"]
    ports: !reset []

  loki:
    profiles: ["observability"]

  prometheus:
    profiles: ["observability"]

  alloy:
    profiles: ["observability"]

  docker-logs-proxy:
    profiles: ["observability"]

  mosquitto-cert-sync:
    profiles: ["observability"]

  mosquitto:
    pull_policy: missing
    ports: !reset []
    environment:
      # Plugin libcurl reads SSL_CERT_FILE as CURLOPT_CAINFO (ropc-form-body.patch).
      SSL_CERT_FILE: /caddy-local-ca/root.crt
    volumes:
      - /opt/freedriver-secrets/caddy-local-root.crt:/caddy-local-ca/root.crt:ro

  fixture-house:
    build:
      context: ./ci/fixture-house
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      MQTT_CA: /certs/ca.crt
      INSTANCE_ID: ${FIXTURE_INSTANCE_ID:-pending}
      MQTT_PASSWORD: ${FIXTURE_HOUSE_PASSWORD:-pending}
      INSTANCE_NAME: Fixture
      APPLIANCES: hallway,fridge
    volumes:
      - /opt/freedriver-secrets/mqtt-internal/ca.crt:/certs/ca.crt:ro
    depends_on:
      - mosquitto
    expose:
      - "8080"

  sms:
    pull_policy: missing
    environment:
      QUARKUS_TLS_TRUST_ALL: "true"
      FREEDRIVER_SEED_PHONE: ${FREEDRIVER_SEED_PHONE:?FREEDRIVER_SEED_PHONE is required}
      JAVA_OPTS_APPEND: "-Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager -Xmx384m"
    depends_on:
      twilio-stub:
        condition: service_started
      mongodb:
        condition: service_healthy

  twilio-stub:
    build:
      context: ./ci/twilio-verify-stub
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
