# Internal sign-in code service. Keycloak calls http://sms:8080 on the compose network.
# HTTP contract and limits: docs/sms-otp.md.
quarkus.application.name=freedriver-sms
quarkus.http.port=8080

# /health/live is liveness (200 while the process runs; the compose healthcheck calls it).
# /health and /health/ready are readiness (200 only once the sender is configured).
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.ui.enabled=false

# Shared secret from Keycloak (X-Freedriver-Sms-Secret). Empty or the placeholder refuses every call.
freedriver.sms.shared-secret=${SMS_OTP_SHARED_SECRET:}

# Sender: Twilio Verify. Credentials come only from the environment: TWILIO_ACCOUNT_SID,
# TWILIO_API_KEY_SID, TWILIO_API_KEY_SECRET, TWILIO_VERIFY_SERVICE_SID (#170). The four lines below
# only pass them into SmsConfig and hold no value. With the Twilio sender, startup fails if any is
# missing. Only the test profile may change the base URL.
freedriver.sms.sender=twilio
freedriver.sms.twilio.base-url=https://verify.twilio.com
freedriver.sms.twilio.timeout=5s
freedriver.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
freedriver.sms.twilio.api-key-sid=${TWILIO_API_KEY_SID:}
freedriver.sms.twilio.api-key-secret=${TWILIO_API_KEY_SECRET:}
freedriver.sms.twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}

# Per-number limits.
freedriver.sms.rate-limit.window=15m
freedriver.sms.rate-limit.sends-per-number=5
freedriver.sms.rate-limit.wrong-codes-per-number=5

# Short windows. A Redis restart may clear them.
# One managed Redis client (quarkus-redis-client). Production uses the compose Redis host; it is not
# a public port. Dev and test start a Redis container through Dev Services, on the compose image tag.
%prod.quarkus.redis.hosts=${FREEDRIVER_REDIS_URL:redis://redis:6379}
quarkus.redis.devservices.image-name=redis:7.4-alpine
# Rate-limit windows are keys freedriver:rate:sms:*.
freedriver.rate-limit.namespace=sms

# Service-wide daily send cap. The server sets FREEDRIVER_SMS_DAILY_SEND_CAP; there is no
# production default, so a production start without it fails.
# Production stores the UTC-day count in daily-send-cap.
# The test profile keeps that count in memory.
%dev.freedriver.sms.daily-send-cap=20
%test.freedriver.sms.daily-send-cap=20

# Phone allowlist (phones), sign-in times (sign-ins), agreements (consents), and the daily send count
# (daily-send-cap) are collections in the dashboard Mongo. Dev and test start a Mongo container through
# Dev Services, on the compose image tag; compose points production at mongodb.
# Open SMS codes are Redis keys freedriver:sms:code: and expire five minutes after the send.
quarkus.mongodb.devservices.enabled=false
%dev.quarkus.mongodb.devservices.enabled=true
%test.quarkus.mongodb.devservices.enabled=true
quarkus.mongodb.devservices.image-name=mongo:8.0
# Same workaround as the compose service: without it mongo:8.0 exits before it accepts
# connections on the CI kernel.
quarkus.mongodb.devservices.container-env.GLIBC_TUNABLES=glibc.pthread.rseq=1
quarkus.mongodb.database=freedriver
# Each test start gets its own database, as it gets its own data directory.
%test.quarkus.mongodb.database=freedriver-test-${quarkus.uuid}
quarkus.log.category."org.mongodb.driver".level=WARN

# Phone list seed and the agreement archive. consents.jsonl in the data directory is imported into
# consents once, when that collection is empty, and stays as the archive.
# kaze's number (FREEDRIVER_SEED_PHONE, sms only). Startup adds it to the phone list as user kaze
# when it is not there yet. Empty adds nothing; a value that is not +1 and ten digits stops startup.
freedriver.sms.seed-phone=${FREEDRIVER_SEED_PHONE:}
freedriver.sms.data-dir=/deployments/data
%dev.freedriver.sms.data-dir=target/sms-data
%test.freedriver.sms.data-dir=${java.io.tmpdir}/freedriver-sms-test/${quarkus.uuid}

# HTTP client request and response logging stays off in every profile.
quarkus.log.category."jdk.internal.httpclient".level=OFF
quarkus.log.category."jdk.httpclient".level=OFF
quarkus.log.category."com.twilio".level=OFF
quarkus.log.category."org.apache.http".level=OFF

# Dev and tests use the in-memory fake sender, which only dev and test builds contain.
%dev.freedriver.sms.sender=fake
%test.freedriver.sms.sender=fake
%test.freedriver.sms.shared-secret=test-only-shared-secret
%test.quarkus.http.test-port=0
