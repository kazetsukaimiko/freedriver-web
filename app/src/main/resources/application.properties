# Deploy stamps quarkus.application.version as YEAR-MONTH_rBUILD_NUM. Public GET /api/build returns it.
# Quinoa builds and serves the React SPA in src/main/webui.
# Node 22.14+ is required by the current Vite React starter.
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=22.14.0
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/q

# OIDC BFF is wired, off in default until #27. Do not flip enabled=true here —
# CI greps that, and quarkus:dev must start without Keycloak.
# Compose already injects QUARKUS_OIDC_AUTH_SERVER_URL / CLIENT_ID / CREDENTIALS_SECRET.
# Secret is env-only. Never webui. Never a git literal.
quarkus.oidc.enabled=false
quarkus.keycloak.devservices.enabled=false
quarkus.oidc.devservices.enabled=false
quarkus.oidc.application-type=web-app
quarkus.oidc.auth-server-url=https://auth.freedriver.io/realms/freedriver
quarkus.oidc.client-id=freedriver-api
quarkus.oidc.credentials.secret=${QUARKUS_OIDC_CREDENTIALS_SECRET:}
# Session cookie is HttpOnly in quarkus-oidc (OidcUtils.createCookie). There is no config key for that.
quarkus.oidc.authentication.cookie-same-site=lax
quarkus.oidc.authentication.cookie-force-secure=true
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.roles.source=accesstoken

# Map/command fail-closed when a session is required. SPA, hello, health, build stay public.
quarkus.http.auth.permission.public.paths=/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.appliances.paths=/api/appliances,/api/appliances/*
quarkus.http.auth.permission.appliances.policy=authenticated

# Browser never speaks MQTT. CORS is an allowlist, not *.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://app.freedriver.io
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-csrf-token
quarkus.http.cors.exposed-headers=content-type
quarkus.http.cors.access-control-allow-credentials=true

# ---------------------------------------------------------------------------
# Appliances map/command API
# Default/prod: resource is inactive (404). Live MQTT publish is OFF.
# Do not enable live commands until #25 is Done and Security signs off on #27.
# ---------------------------------------------------------------------------
freedriver.appliances.enabled=false
freedriver.appliances.live-commands=false
freedriver.appliances.mock=false
freedriver.appliances.stale-after=20s
freedriver.appliances.command-timeout=${FREEDRIVER_COMMAND_TIMEOUT:5s}
freedriver.appliances.command-timeout-max=30s
freedriver.appliances.rate-limit.permits=30
freedriver.appliances.rate-limit.window=60s
freedriver.appliances.mock-refresh=false

# Live MQTT adapter (#40). Not started: live-commands stays false.
# Host is compose-network mosquitto, never mqtt.freedriver.io. MQTTS 8883 only.
freedriver.mqtt.host=mosquitto
freedriver.mqtt.port=8883
freedriver.mqtt.tls=true
freedriver.mqtt.username=api
# Password and instance ids are env-only. Never git literals.
# FREEDRIVER_MQTT_API_PASSWORD, FREEDRIVER_MQTT_INSTANCE_IDS

# quarkus:dev — mock event source on the same ApplianceControl bus, no broker, no Keycloak.
# /api/hello and /api/health stay 200. Turn mock off with freedriver.appliances.mock=false.
# Single %dev auth path: DevOpenAuthAugmentor (io.freedriver.app.security, @IfBuildProfile("dev"))
# grants principal dev + role dashboard so @RolesAllowed runs. Authorization stays ON.
# Do not set quarkus.security.auth.enabled-in-dev-mode=false (that skips @RolesAllowed).
%dev.freedriver.appliances.enabled=true
%dev.freedriver.appliances.live-commands=false
%dev.freedriver.appliances.mock=true
%dev.freedriver.appliances.mock-refresh=true
%dev.quarkus.oidc.enabled=false
%dev.quarkus.http.cors.origins=https://app.freedriver.io,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173

# Tests — mock fixture, auth REQUIRED via @TestSecurity. OIDC stays off.
# DevOpenAuthAugmentor is not in the test build. 401/403 without @TestSecurity.
%test.quarkus.oidc.enabled=false
%test.freedriver.appliances.enabled=true
%test.freedriver.appliances.live-commands=false
%test.freedriver.appliances.mock=true
%test.freedriver.appliances.mock-refresh=false
%test.freedriver.appliances.command-timeout=200ms
%test.freedriver.appliances.rate-limit.permits=8
%test.freedriver.appliances.rate-limit.window=60s
%test.quarkus.http.test-port=0
