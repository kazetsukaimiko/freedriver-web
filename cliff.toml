# Plain-text changelog. No markdown symbols. Each release is the sequential
# build number (annotated tag message) and a UTC date, then group names, then
# "- " entries. A blank line separates releases. #151.
[changelog]
header = ""
# Rendered once per tag. git-cliff joins those renders newest first.
# Control tags eat their own newlines so only the text lines remain.
body = """
{% if commits | length > 0 -%}
{% if message -%}
{{ message | trim }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
{{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% endif -%}
{% for group, group_commits in commits | group_by(attribute="group") -%}
{{ group | striptags | trim }}
{% for commit in group_commits -%}
- {{ commit.message | split(pat="\n") | first }}{% if commit.scope %} ({{ commit.scope }}){% endif %}
{% endfor -%}
{% endfor %}
{% endif -%}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
commit_preprocessors = []
commit_parsers = [
  { message = "(?m)(?:^|\\n)BREAKING CHANGE:|!:", group = "<!-- 00 -->Breaking changes" },
  { message = "^feat", group = "<!-- 01 -->Features" },
  { message = "^fix", group = "<!-- 02 -->Fixes" },
  { message = "^perf", group = "<!-- 03 -->Performance" },
  { message = "^refactor", group = "<!-- 04 -->Refactor" },
  { message = "^docs", group = "<!-- 05 -->Documentation" },
  { message = "^test", group = "<!-- 06 -->Testing" },
  { message = "^build", group = "<!-- 07 -->Build" },
  { message = "^ci", group = "<!-- 08 -->CI" },
  { message = "^chore", group = "<!-- 09 -->Chore" },
  { message = "^Merge( |$)", skip = true },
  { message = ".*", group = "<!-- 10 -->Other" },
]
# Version tags and the older sequential deploy tags. sms/* is not a release.
tag_pattern = "^(?:[0-9]+\\.[0-9]+\\.[0-9]+|[0-9]{4}-[0-9]{2}_r[0-9]+)$"
ignore_tags = "^sms/"
sort_commits = "newest"
topo_order = false
