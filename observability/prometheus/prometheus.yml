global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # Quarkus Micrometer path. Target stays down until the app exports metrics.
  - job_name: app
    metrics_path: /q/metrics
    static_configs:
      - targets: ["app:8080"]
