global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # Quarkus Micrometer path. Target stays down until the app exports metrics.
  - job_name: dashboard
    metrics_path: /q/metrics
    dns_sd_configs:
      - names: [dashboard]
        type: A
        port: 8080

  # Down until the dispatcher exports Micrometer.
  - job_name: agent-dispatcher
    metrics_path: /q/metrics
    dns_sd_configs:
      - names: [agent-dispatcher]
        type: A
        port: 8080

  - job_name: autonomy-mcp
    metrics_path: /q/metrics
    dns_sd_configs:
      - names: [autonomy-mcp]
        type: A
        port: 8080
