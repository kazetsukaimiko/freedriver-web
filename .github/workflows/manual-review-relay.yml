name: manual-review-relay

# pull_request_review runs the workflow file from the merge commit, so this
# job stays permissionless and does not check out code. The gate on the
# default branch wakes from workflow_run when this run completes.
run-name: relay-pr-${{ github.event.pull_request.number }}

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    if: github.repository == 'kazetsukaimiko/freedriver-web'
    steps:
      - name: Relay the review event
        run: echo "relay only; no checkout and no token use"
