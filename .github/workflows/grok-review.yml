name: Grok review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    if: github.repository == 'kazetsukaimiko/freedriver-web'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load review prompt
        id: prompt
        run: |
          {
            echo 'text<<GROK_PROMPT_EOF'
            cat .github/grok-review-prompt.md
            echo GROK_PROMPT_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Grok code review
        uses: tarmojussila/xai-code-review@v0.1.0
        with:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL || 'grok-4' }}
          XAI_SYSTEM_PROMPT: ${{ steps.prompt.outputs.text }}
          XAI_REVIEWER_NAME: Grok review
          EXCLUDE_PATTERNS: "*.lock,package-lock.json,yarn.lock,pnpm-lock.yaml,target/**"
