name: Grok review

# Same-repository pull request review (#64). pull_request_target runs main's
# grok_review.py and prompts in the grok-review environment. The head is fetched
# into pr/ with core.symlinks false, so each symlink is a plain file, and both
# jobs execute that main script.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: grok-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Principled Engineering Review
    runs-on: ubuntu-latest
    if: github.repository == 'kazetsukaimiko/freedriver-web' && github.event.pull_request.head.repo.full_name == github.repository
    environment: grok-review
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout main's reviewer script and prompt
        uses: actions/checkout@v5
        with:
          path: reviewer
          persist-credentials: false

      - name: Fetch PR head and base as data
        env:
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init -q pr
          git -C pr config core.symlinks false
          git -C pr remote add origin "https://github.com/${REPO}.git"
          git -C pr fetch -q --no-tags origin "$HEAD_SHA" "$BASE_SHA"
          git -C pr -c advice.detachedHead=false checkout -q "$HEAD_SHA"

      - name: Review with full files and neighbors
        working-directory: pr
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL || 'grok-4' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GROK_REVIEW_PROMPT: ${{ github.workspace }}/reviewer/.github/grok-review-prompt.md
          GROK_REVIEW_MODE: engineering
        run: python3 "$GITHUB_WORKSPACE/reviewer/.github/scripts/grok_review.py" --mode engineering --prompt "$GITHUB_WORKSPACE/reviewer/.github/grok-review-prompt.md"

  security-review:
    name: Security Review
    runs-on: ubuntu-latest
    if: github.repository == 'kazetsukaimiko/freedriver-web' && github.event.pull_request.head.repo.full_name == github.repository
    environment: grok-review
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout main's reviewer script and prompt
        uses: actions/checkout@v5
        with:
          path: reviewer
          persist-credentials: false

      - name: Fetch PR head and base as data
        env:
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init -q pr
          git -C pr config core.symlinks false
          git -C pr remote add origin "https://github.com/${REPO}.git"
          git -C pr fetch -q --no-tags origin "$HEAD_SHA" "$BASE_SHA"
          git -C pr -c advice.detachedHead=false checkout -q "$HEAD_SHA"

      - name: Review with full files and neighbors
        working-directory: pr
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL || 'grok-4' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GROK_REVIEW_PROMPT: ${{ github.workspace }}/reviewer/.github/grok-security-prompt.md
          GROK_REVIEW_MODE: security
        run: python3 "$GITHUB_WORKSPACE/reviewer/.github/scripts/grok_review.py" --mode security --prompt "$GITHUB_WORKSPACE/reviewer/.github/grok-security-prompt.md"
