name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.repository == 'kazetsukaimiko/freedriver-web'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "23"
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # Restores ~/.m2/repository, ~/.m2/wrapper, and ~/.m2/build-cache.
      # The Packages credential lives in ~/.m2/settings.xml.
      # continue-on-error keeps the test step as the result when the cache misses.
      - name: Restore Maven repository and build cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
            ~/.m2/build-cache
          key: freedriver-maven-v1-${{ github.sha }}
          restore-keys: |
            freedriver-maven-v1-

      - name: Tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # skipSave is false on a push to main, which records that green test in the build cache.
          skip_save=true
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            skip_save=false
          fi
          echo "maven build cache skipSave=${skip_save}"
          ./mvnw -B test \
            -Dmaven.build.cache.enabled=true \
            -Dmaven.build.cache.remote.enabled=false \
            -Dmaven.build.cache.remote.save.enabled=false \
            -Dmaven.build.cache.skipSave="${skip_save}"

      - name: Mosquitto ACL template is not the live compose mount
        run: |
          if [[ -e mosquitto/acl ]]; then
            echo "git must keep a template only (mosquitto/acl.template); do not ship mosquitto/acl as live"
            exit 1
          fi
          if [[ ! -f mosquitto/acl.template ]]; then
            echo "missing mosquitto/acl.template"
            exit 1
          fi
          if grep -F './mosquitto/acl:/mosquitto/config/acl' docker-compose.yml; then
            echo "compose must not mount the git ACL as live"
            exit 1
          fi
          if grep -E '^\s+- \./mosquitto/acl:' docker-compose.yml; then
            echo "compose must not bind-mount the git ACL file"
            exit 1
          fi
          if ! grep -Eq '^acl_file /mosquitto/config/secrets/acl$' mosquitto/mosquitto.conf; then
            echo "acl_file must point at the secrets mount, not a git-mounted ACL"
            exit 1
          fi
          if grep -E 'CHECKOUT_ACL|/opt/freedriver-web/mosquitto/acl' scripts/provision-mosquitto.sh; then
            echo "apply must write the secrets ACL only, not a checkout/git ACL"
            exit 1
          fi
          if grep -RInE '^[[:space:]]*topic .*(freedriver/v1/home|/home/appliances|/home/commands|[+#]|freedriver/v1/#)' mosquitto scripts docs; then
            echo "topic lines must be exact instance topics (no leftover home/, no + or #)"
            exit 1
          fi
          if ! grep -Fq '__INSTANCE_ID__' mosquitto/acl.template; then
            echo "template must keep the apply-time __INSTANCE_ID__ placeholder"
            exit 1
          fi
          leftover="$(mktemp)"
          printf '%s\n' \
            'user autonomy' \
            'topic write freedriver/v1/home/appliances' \
            'topic read freedriver/v1/home/commands' \
            > "$leftover"
          # Substitutes a version-nibble-1 UUID into the temp ACL and replaces leftover home/ topics in that write.
          ./scripts/provision-mosquitto.sh --acl-only \
            --instance-id 123e4567-e89b-12d3-a456-426614174000 \
            --acl-out "$leftover"
          grep -Fq 'freedriver/v1/123e4567-e89b-12d3-a456-426614174000/appliances' "$leftover"
          grep -Fq 'freedriver/v1/123e4567-e89b-12d3-a456-426614174000/commands' "$leftover"
          if grep -E '^topic ' "$leftover" | grep -E 'home/|[+#]|__INSTANCE_ID__'; then
            echo "apply must write exact topics and drop leftover home/ in the same step"
            exit 1
          fi
          if ./scripts/provision-mosquitto.sh --acl-only \
            --instance-id 123e4567-e89b-12d3-a456-426614174000 \
            --acl-out mosquitto/acl.template; then
            echo "provision must refuse to overwrite the git template"
            exit 1
          fi
          if ./scripts/provision-mosquitto.sh --acl-only --instance-id not-a-uuid --acl-out "$leftover"; then
            echo "provision must reject a non-UUID instanceId"
            exit 1
          fi
          rm -f "$leftover"

      - name: mqtt.freedriver.io is an ACME 404 stub; LE copy is Techops-owned
        run: |
          if ! awk '/^mqtt\.freedriver\.io \{/,/^}/' Caddyfile | grep -q 'respond 404'; then
            echo "mqtt.freedriver.io must be a 404 ACME stub"
            exit 1
          fi
          if awk '/^mqtt\.freedriver\.io \{/,/^}/' Caddyfile | grep -qiE 'reverse_proxy|redir'; then
            echo "do not put an HTTP app or MQTT proxy on mqtt.freedriver.io"
            exit 1
          fi
          if grep -E '"1883:|"1883' docker-compose.yml; then
            echo "do not open 1883"
            exit 1
          fi
          if ! grep -q 'mosquitto-cert-sync:' docker-compose.yml; then
            echo "compose must run the Techops LE→Mosquitto cert sync sidecar"
            exit 1
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path
          compose = Path("docker-compose.yml").read_text()
          i = compose.find("  mosquitto-cert-sync:")
          if i < 0:
              raise SystemExit("missing mosquitto-cert-sync service")
          rest = compose[i:]
          nxt = re.search(r"\n  [A-Za-z0-9_-]+:", rest[1:])
          block = rest if nxt is None else rest[: nxt.start() + 1]
          if "/var/run/docker.sock" in block:
              raise SystemExit("cert-sync sidecar must not mount the Docker daemon socket")
          if 'pid: "service:mosquitto"' not in block and "pid: service:mosquitto" not in block:
              raise SystemExit("cert-sync must share mosquitto PID namespace")
          df = Path("scripts/mosquitto-cert-sync.Dockerfile").read_text()
          if "docker-cli" in df or "docker.sock" in df:
              raise SystemExit("cert-sync image must not include docker-cli or a daemon socket")
          script = Path("scripts/sync-mosquitto-le-cert.sh").read_text()
          if "docker.sock" in script or "docker kill" in script or "docker ps" in script:
              raise SystemExit("sync script must not use the Docker API")
          print("cert-sync: no daemon socket; pid-share SIGHUP")
          PY
          if ! grep -q 'will not overwrite Let' scripts/provision-mosquitto.sh; then
            echo "provision-mosquitto.sh must leave existing server.crt/key in place"
            exit 1
          fi
          if grep -E 'selfsigned' scripts/sync-mosquitto-le-cert.sh | grep -q 'cp \|mv '; then
            echo "sync must replace server.crt/key in place, not keep a selfsigned leftover"
            exit 1
          fi
          chmod +x scripts/sync-mosquitto-le-cert.sh scripts/test-sync-mosquitto-le-cert.sh
          ./scripts/test-sync-mosquitto-le-cert.sh

      - name: Alloy reaches Docker only through the list-and-logs proxy
        run: |
          python3 observability/docker-logs-proxy/test_docker_logs_proxy.py
          docker build -t freedriver-docker-logs-proxy:ci observability/docker-logs-proxy

      - name: Browser must not speak MQTT
        run: |
          if grep -RInE 'mqtt|8883|mosquitto' java/dashboard/src/main/webui; then
            echo "webui must not mention MQTT"
            exit 1
          fi

      - name: Mock and OIDC stay off in the default profile
        run: |
          if grep -E '^freedriver\.appliances\.enabled=true' java/dashboard/src/main/resources/application.properties; then
            echo "default profile must not enable the appliances API"
            exit 1
          fi
          if grep -E '^freedriver\.appliances\.mock=true' java/dashboard/src/main/resources/application.properties; then
            echo "mock event source must not ship in the default profile"
            exit 1
          fi
          if grep -E '^freedriver\.appliances\.live-commands=true' java/dashboard/src/main/resources/application.properties; then
            echo "live commands must not ship in the default profile"
            exit 1
          fi
          if grep -E '^quarkus\.oidc\.enabled=true' java/dashboard/src/main/resources/application.properties; then
            echo "do not flip OIDC on in the default profile"
            exit 1
          fi
          if grep -E '^quarkus\.oidc\.enabled=true' java/agent-dispatcher/src/main/resources/application.properties; then
            echo "do not flip dispatcher OIDC on in the default profile"
            exit 1
          fi

      - name: SMS OTP scaffold is internal and fail-closed
        run: ./scripts/test-sms-otp-scaffold.sh

      - name: Keycloak SMS OTP SPI tests
        run: |
          set -euo pipefail
          skip_save=true
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            skip_save=false
          fi
          # package and install set skipSave. The SPI package step records the cache entry on main.
          # package/install skip tests. Do not let that replace a green test entry.
          # A test-phase cache hit restores target/classes as the project artifact.
          # The jar is written, install does not see a file, and the build stops.
          # Keep the cache off here so sms-model is packaged and installed.
          ./mvnw -B -C -pl sms-client -am package -DskipTests \
            -Dmaven.build.cache.enabled=false \
            -Dmaven.build.cache.remote.enabled=false \
            -Dmaven.build.cache.remote.save.enabled=false \
            -Dmaven.build.cache.skipSave=true
          ./mvnw -B -C -pl sms-client -am install -DskipTests \
            -Dmaven.build.cache.enabled=false \
            -Dmaven.build.cache.remote.enabled=false \
            -Dmaven.build.cache.remote.save.enabled=false \
            -Dmaven.build.cache.skipSave=true
          ./mvnw -B -f keycloak/sms-otp-spi/pom.xml -Dsource.commit=ci package \
            -Dmaven.build.cache.enabled=true \
            -Dmaven.build.cache.remote.enabled=false \
            -Dmaven.build.cache.remote.save.enabled=false \
            -Dmaven.build.cache.skipSave="${skip_save}"
          ./scripts/check-sms-otp-provider-jar.sh \
            keycloak/sms-otp-spi/target/freedriver-sms-otp-spi-1.0.0-SNAPSHOT.jar \
            ci

      - name: Maven cache does not contain the Packages credential
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          token = os.environ["GITHUB_TOKEN"].encode()
          home = Path.home()
          roots = [
              home / ".m2" / "repository",
              home / ".m2" / "wrapper",
              home / ".m2" / "build-cache",
          ]
          settings = home / ".m2" / "settings.xml"
          for root in roots:
              if not root.exists():
                  continue
              if settings.exists():
                  try:
                      settings.resolve().relative_to(root.resolve())
                  except ValueError:
                      pass
                  else:
                      raise SystemExit(f"settings.xml is inside {root.name}")
              for path in root.rglob("*"):
                  if not path.is_file() or path.is_symlink():
                      continue
                  previous = b""
                  with path.open("rb") as handle:
                      while True:
                          chunk = handle.read(1024 * 1024)
                          if not chunk:
                              break
                          if token in previous + chunk:
                              raise SystemExit(
                                  f"Packages credential was written into the Maven cache ({path.name})"
                              )
                          previous = chunk[-(len(token) - 1) :] if len(token) > 1 else b""
          print("Maven cache paths do not contain the Packages credential or settings.xml")
          PY

      # Saves the Maven cache after a green push to main.
      # continue-on-error leaves the test step as the result when the save fails.
      - name: Save Maven repository and build cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
            ~/.m2/build-cache
          key: freedriver-maven-v1-${{ github.sha }}

      - name: VPS image must not bake a Packages token
        run: |
          if grep -E 'GITHUB_TOKEN|GH_TOKEN|PACKAGES_TOKEN' java/dashboard/src/main/docker/Dockerfile.compose; then
            echo "do not pass a GitHub Packages token as Docker ARG/ENV"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          text = Path("java/dashboard/src/main/docker/Dockerfile.compose").read_text()
          runtime = "FROM " + text.rsplit("FROM ", 1)[1]
          if "settings" in runtime.lower():
              raise SystemExit("runtime stage must not mention settings.xml")
          print("runtime stage does not copy Maven settings")
          PY

      - name: Publish mqtt-contract
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          YEAR="$(date -u +%Y)"
          MONTH="$(date -u +%m)"
          NEW_VERSION="${YEAR}-${MONTH}_r${{ github.run_number }}"
          echo "Publishing freedriver-mqtt-contract as ${NEW_VERSION}"
          # Publishes mqtt-contract at the YEAR-MONTH_rRUN stamp with the build cache off.
          ./mvnw -B --no-transfer-progress \
            -Dmaven.build.cache.enabled=false \
            -Dmaven.build.cache.remote.enabled=false \
            -Dmaven.build.cache.remote.save.enabled=false \
            org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion="${NEW_VERSION}" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true
          ./mvnw -B --no-transfer-progress -pl mqtt-contract -am deploy -DskipTests \
            -Dmaven.build.cache.enabled=false \
            -Dmaven.build.cache.remote.enabled=false \
            -Dmaven.build.cache.remote.save.enabled=false

  webui:
    runs-on: ubuntu-latest
    if: github.repository == 'kazetsukaimiko/freedriver-web'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # quarkus.quinoa.package-manager-install.node-version
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: java/dashboard/src/main/webui/package-lock.json

      - name: Frontend tests
        working-directory: java/dashboard/src/main/webui
        run: |
          npm ci
          npm test

  # Builds the full dashboard image, the cert-sync image, and compose config on the pull request (#116, #118).
  prod-image:
    runs-on: ubuntu-latest
    if: github.repository == 'kazetsukaimiko/freedriver-web'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build the full dashboard image
        run: |
          set -euo pipefail
          docker build \
            -f java/dashboard/src/main/docker/Dockerfile.compose \
            --build-arg BUILD_NUMBER=ci \
            .

      - name: Build the cert-sync image
        run: |
          set -euo pipefail
          docker build \
            -f scripts/mosquitto-cert-sync.Dockerfile \
            -t freedriver-mosquitto-cert-sync:ci \
            scripts

      - name: Compose config against a dummy env file
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/freedriver-secrets
          printf '%s\n' '# placeholder for compose interpolation' | sudo tee /opt/freedriver-secrets/twilio-verify.env >/dev/null
          dummy="$RUNNER_TEMP/freedriver-ci.env"
          cat > "$dummy" <<'EOF'
          BUILD_NUMBER=ci
          SOURCE_COMMIT=ci
          QUARKUS_OIDC_CREDENTIALS_SECRET=ci-not-a-secret
          KC_DB_PASSWORD=ci-not-a-secret
          KC_BOOTSTRAP_ADMIN_PASSWORD=ci-not-a-secret
          GF_SECURITY_ADMIN_PASSWORD=ci-not-a-secret
          FREEDRIVER_SMS_DAILY_SEND_CAP=1
          EOF
          docker compose --env-file "$dummy" config --quiet
          docker compose --env-file "$dummy" -f docker-compose.yml -f docker-compose.ghcr.yml config --quiet
          DUMMY_ENV="$dummy" python3 - <<'PY'
          import json, os, subprocess
          env = os.environ["DUMMY_ENV"]
          expect = [
              "agent-dispatcher",
              "dashboard",
              "docker-logs-proxy",
              "keycloak",
              "mosquitto-cert-sync",
              "sms",
          ]

          def config(*files):
              cmd = ["docker", "compose", "--env-file", env]
              for path in files:
                  cmd.extend(["-f", path])
              cmd.extend(["config", "--format", "json"])
              return json.loads(subprocess.check_output(cmd, text=True))

          base = config("docker-compose.yml")
          prod = config("docker-compose.yml", "docker-compose.ghcr.yml")
          built = sorted(name for name, svc in base["services"].items() if "build" in svc)
          if built != expect:
              raise SystemExit(f"built services changed: {built}")
          prefix = "ghcr.io/kazetsukaimiko/freedriver-web/"
          for name in expect:
              image = prod["services"][name].get("image", "")
              if not image.startswith(prefix) or not image.endswith(":ci"):
                  raise SystemExit(f"bad prod image for {name}: {image}")
              build = prod["services"][name].get("build")
              dockerfile = build.get("dockerfile") if isinstance(build, dict) else ""
              if not dockerfile:
                  raise SystemExit(f"overlay dropped the Dockerfile for {name}")
              policy = prod["services"][name].get("pull_policy")
              if policy not in ("missing", "if_not_present"):
                  raise SystemExit(f"{name} pull_policy is {policy!r}, want missing")
              base_image = base["services"][name].get("image") or ""
              if "ghcr.io" in base_image:
                  raise SystemExit(f"base compose must not name a GHCR image for {name}")
          for name in ("keycloak", "sms"):
              if base["services"][name].get("pull_policy") != "build":
                  raise SystemExit(f"local {name} pull_policy must stay build")
          print("compose config ok")
          PY
