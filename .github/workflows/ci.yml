name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.repository == 'kazetsukaimiko/freedriver-web'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B test

      - name: Mosquitto ACL template is not the live compose mount
        run: |
          if [[ -e mosquitto/acl ]]; then
            echo "git must keep a template only (mosquitto/acl.template); do not ship mosquitto/acl as live"
            exit 1
          fi
          if [[ ! -f mosquitto/acl.template ]]; then
            echo "missing mosquitto/acl.template"
            exit 1
          fi
          if grep -F './mosquitto/acl:/mosquitto/config/acl' docker-compose.yml; then
            echo "compose must not mount the git ACL as live"
            exit 1
          fi
          if grep -E '^\s+- \./mosquitto/acl:' docker-compose.yml; then
            echo "compose must not bind-mount the git ACL file"
            exit 1
          fi
          if ! grep -Eq '^acl_file /mosquitto/config/secrets/acl$' mosquitto/mosquitto.conf; then
            echo "acl_file must point at the secrets mount, not a git-mounted ACL"
            exit 1
          fi
          if grep -E 'CHECKOUT_ACL|/opt/freedriver-web/mosquitto/acl' scripts/provision-mosquitto.sh; then
            echo "apply must write the secrets ACL only, not a checkout/git ACL"
            exit 1
          fi
          if grep -RInE '^[[:space:]]*topic .*(freedriver/v1/home|/home/appliances|/home/commands|[+#]|freedriver/v1/#)' mosquitto scripts docs; then
            echo "topic lines must be exact instance topics (no leftover home/, no + or #)"
            exit 1
          fi
          if ! grep -Fq '__INSTANCE_ID__' mosquitto/acl.template; then
            echo "template must keep the apply-time __INSTANCE_ID__ placeholder"
            exit 1
          fi
          leftover="$(mktemp)"
          printf '%s\n' \
            'user autonomy' \
            'topic write freedriver/v1/home/appliances' \
            'topic read freedriver/v1/home/commands' \
            > "$leftover"
          # Non-v4 UUID (version nibble 1) must be accepted. Same write must
          # replace leftover home/. CI substitutes into a temp file only —
          # never treat the repo template as the live ACL.
          ./scripts/provision-mosquitto.sh --acl-only \
            --instance-id 123e4567-e89b-12d3-a456-426614174000 \
            --acl-out "$leftover"
          grep -Fq 'freedriver/v1/123e4567-e89b-12d3-a456-426614174000/appliances' "$leftover"
          grep -Fq 'freedriver/v1/123e4567-e89b-12d3-a456-426614174000/commands' "$leftover"
          if grep -E '^topic ' "$leftover" | grep -E 'home/|[+#]|__INSTANCE_ID__'; then
            echo "apply must write exact topics and drop leftover home/ in the same step"
            exit 1
          fi
          if ./scripts/provision-mosquitto.sh --acl-only \
            --instance-id 123e4567-e89b-12d3-a456-426614174000 \
            --acl-out mosquitto/acl.template; then
            echo "provision must refuse to overwrite the git template"
            exit 1
          fi
          if ./scripts/provision-mosquitto.sh --acl-only --instance-id not-a-uuid --acl-out "$leftover"; then
            echo "provision must reject a non-UUID instanceId"
            exit 1
          fi
          rm -f "$leftover"

      - name: Browser must not speak MQTT
        run: |
          if grep -RInE 'mqtt|8883|mosquitto' app/src/main/webui; then
            echo "webui must not mention MQTT"
            exit 1
          fi

      - name: Mock and OIDC stay off in the default profile
        run: |
          if grep -E '^freedriver\.appliances\.enabled=true' app/src/main/resources/application.properties; then
            echo "default profile must not enable the appliances API"
            exit 1
          fi
          if grep -E '^freedriver\.appliances\.mock=true' app/src/main/resources/application.properties; then
            echo "mock event source must not ship in the default profile"
            exit 1
          fi
          if grep -E '^freedriver\.appliances\.live-commands=true' app/src/main/resources/application.properties; then
            echo "live commands must not ship in the default profile"
            exit 1
          fi
          if grep -E '^quarkus\.oidc\.enabled=true' app/src/main/resources/application.properties; then
            echo "do not flip OIDC on in the default profile"
            exit 1
          fi

      - name: VPS image must not bake a Packages token
        run: |
          if grep -E 'GITHUB_TOKEN|GH_TOKEN|PACKAGES_TOKEN' app/src/main/docker/Dockerfile.compose; then
            echo "do not pass a GitHub Packages token as Docker ARG/ENV"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          text = Path("app/src/main/docker/Dockerfile.compose").read_text()
          runtime = "FROM " + text.rsplit("FROM ", 1)[1]
          if "settings" in runtime.lower():
              raise SystemExit("runtime stage must not mention settings.xml")
          print("runtime stage does not copy Maven settings")
          PY

      - name: Publish mqtt-contract
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          YEAR="$(date -u +%Y)"
          MONTH="$(date -u +%m)"
          NEW_VERSION="${YEAR}-${MONTH}_r${{ github.run_number }}"
          echo "Publishing freedriver-mqtt-contract as ${NEW_VERSION}"
          ./mvnw -B --no-transfer-progress \
            org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion="${NEW_VERSION}" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true
          ./mvnw -B --no-transfer-progress -pl mqtt-contract -am deploy -DskipTests
