name: manual-review label

# Keeps the manual-review label in step with GitHub's review request to kazetsukaimiko (#558):
# on from that request until kazetsukaimiko approves the current head, on again when that
# approval is dismissed, off when the request is removed with no review given.
# It reads only the pull request's review requests and reviews and writes only the label.
# It checks out the default branch for the script and never checks out or runs the pull
# request's code. pr-ready-when-green sets the label in its own run, because the events its
# workflow token causes start no workflow.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

concurrency:
  group: manual-review-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    if: >-
      github.repository == 'kazetsukaimiko/freedriver-web' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the label script from the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Set or remove manual-review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/manual_review_label.py
