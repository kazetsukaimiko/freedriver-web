name: manual-review-gate

# This file runs only as stored on the default branch. It reads the API and
# posts the manual-review-gate commit status on the pull request head.
# It does not check out a pull request. issue_comment and workflow_run attach
# their check run to the default branch, so the job's check name is not the
# status context the ruleset will require.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ["manual-review-relay"]
    types: [completed]

permissions:
  statuses: write
  pull-requests: read
  contents: read

concurrency:
  group: manual-review-gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  manual-review-gate:
    name: Post manual-review-gate status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.repository == 'kazetsukaimiko/freedriver-web' &&
      (
        github.event_name == 'pull_request_target' ||
        github.event_name == 'workflow_run' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request)
      )
    steps:
      - name: Post the manual-review-gate commit status
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          CONTEXT = "manual-review-gate"
          KAZE = "kazetsukaimiko"
          SECURITY = "lonewatt-security"
          HEX_SHA = re.compile(r"^[0-9a-fA-F]{40}$")
          RELAY_TITLE = re.compile(r"^relay-pr-([0-9]+)$")
          PROVISION = re.compile(r"^scripts/provision-[^/]+$")
          APP_PROPS = re.compile(
              r"^(?:app|java/dashboard)/src/main/resources/application[^/]*\.properties$"
          )

          DESC_CLEAR = "No manual review required"
          DESC_BOTH = "Needs kazetsukaimiko approval on head and a lonewatt-security verdict"
          DESC_APPROVAL = "Needs kazetsukaimiko approval on the head"
          DESC_VERDICT = "Needs a lonewatt-security verdict for the head"
          DESC_OK = "kazetsukaimiko approved the head and security cleared it"

          # Ticket #124 names app/. On main those files are under java/dashboard/.
          EXACT_PATHS = {
              "docker-compose.yml",
              "app/src/main/java/io/freedriver/app/appliances/CommandRateLimiter.java",
              "java/dashboard/src/main/java/io/freedriver/app/appliances/CommandRateLimiter.java",
              "app/src/main/java/io/freedriver/app/appliances/AppliancesDisabledFilter.java",
              "java/dashboard/src/main/java/io/freedriver/app/appliances/AppliancesDisabledFilter.java",
              "app/src/main/java/io/freedriver/app/api/rs/ext/EmptyUnauthorizedExceptionMapper.java",
              "java/dashboard/src/main/java/io/freedriver/app/api/rs/ext/EmptyUnauthorizedExceptionMapper.java",
              "app/src/main/java/io/freedriver/app/api/rs/ext/RateLimitedExceptionMapper.java",
              "java/dashboard/src/main/java/io/freedriver/app/api/rs/ext/RateLimitedExceptionMapper.java",
          }
          PREFIXES = (
              ".github/",
              "keycloak/",
              "mosquitto/",
              "app/src/main/java/io/freedriver/app/security/",
              "java/dashboard/src/main/java/io/freedriver/app/security/",
          )

          def path_requires_review(path):
              if not path:
                  return False
              if path in EXACT_PATHS:
                  return True
              if path.startswith(PREFIXES):
                  return True
              if PROVISION.fullmatch(path):
                  return True
              if APP_PROPS.fullmatch(path):
                  return True
              return False

          def matched_paths(files):
              names = []
              for item in files:
                  for key in ("filename", "previous_filename"):
                      value = item.get(key)
                      if value and path_requires_review(value) and value not in names:
                          names.append(value)
              return names

          def has_manual_label(pr):
              for label in pr.get("labels") or []:
                  if (label or {}).get("name") == "manual-review":
                      return True
              return False

          def verdict_comment(body, head):
              text = (body or "").replace("\r\n", "\n").replace("\r", "\n")
              commit_ok = False
              verdict_ok = False
              for raw in text.split("\n"):
                  line = raw.strip()
                  if line == "Verdict: cleared.":
                      verdict_ok = True
                      continue
                  if not line.startswith("Commit:"):
                      continue
                  sha = line[len("Commit:") :].strip()
                  if HEX_SHA.fullmatch(sha) and sha.lower() == head.lower():
                      commit_ok = True
              return commit_ok and verdict_ok

          def security_cleared(comments, head):
              for comment in comments:
                  login = ((comment.get("user") or {}).get("login")) or ""
                  if login != SECURITY:
                      continue
                  if verdict_comment(comment.get("body") or "", head):
                      return True
              return False

          def kaze_approved(reviews, head):
              rows = []
              for review in reviews:
                  login = ((review.get("user") or {}).get("login")) or ""
                  if login != KAZE:
                      continue
                  state = review.get("state") or ""
                  if state == "PENDING":
                      continue
                  rows.append(
                      (
                          review.get("submitted_at") or "",
                          state,
                          review.get("commit_id") or "",
                      )
                  )
              rows.sort()
              approved = False
              for _submitted, state, commit_id in rows:
                  # A dismissal or change request counts only on this head.
                  # Dismissing an older commit must not clear a later approval.
                  if state == "APPROVED" and commit_id == head:
                      approved = True
                  elif state in ("CHANGES_REQUESTED", "DISMISSED") and commit_id == head:
                      approved = False
              return approved

          def decide(pr, files, reviews, comments):
              head = pr["head"]["sha"]
              manual = has_manual_label(pr) or bool(matched_paths(files))
              if not manual:
                  return "success", DESC_CLEAR
              approved = kaze_approved(reviews, head)
              cleared = security_cleared(comments, head)
              if approved and cleared:
                  return "success", DESC_OK
              if not approved and not cleared:
                  return "failure", DESC_BOTH
              if not approved:
                  return "failure", DESC_APPROVAL
              return "failure", DESC_VERDICT

          def targets_main(pr):
              return ((pr.get("base") or {}).get("ref")) == "main"

          def self_check():
              for text in (DESC_CLEAR, DESC_BOTH, DESC_APPROVAL, DESC_VERDICT, DESC_OK):
                  if len(text) > 140:
                      raise SystemExit("status description is longer than 140")
              head = "a" * 40
              other = "b" * 40

              def pr(labels=None, sha=head):
                  return {
                      "head": {"sha": sha},
                      "base": {"ref": "main"},
                      "labels": [{"name": name} for name in (labels or [])],
                  }

              def review(login, state, commit, at):
                  return {
                      "user": {"login": login},
                      "state": state,
                      "commit_id": commit,
                      "submitted_at": at,
                  }

              def comment(login, body):
                  return {"user": {"login": login}, "body": body}

              cleared = "Commit: %s\nVerdict: cleared.\n" % head
              assert path_requires_review(".github/workflows/manual-review-gate.yml")
              assert path_requires_review(".github/CODEOWNERS")
              assert path_requires_review("docker-compose.yml")
              assert path_requires_review("keycloak/realms/freedriver.json")
              assert path_requires_review("mosquitto/mosquitto.conf")
              assert path_requires_review("scripts/provision-mosquitto.sh")
              assert path_requires_review(
                  "app/src/main/java/io/freedriver/app/security/CsrfFilter.java"
              )
              assert path_requires_review(
                  "java/dashboard/src/main/java/io/freedriver/app/security/CsrfFilter.java"
              )
              assert path_requires_review(
                  "java/dashboard/src/main/java/io/freedriver/app/appliances/CommandRateLimiter.java"
              )
              assert path_requires_review(
                  "java/dashboard/src/main/resources/application.properties"
              )
              assert path_requires_review(
                  "java/dashboard/src/main/resources/application-prod.properties"
              )
              assert not path_requires_review("scripts/provision-mosquitto.sh/extra")
              assert not path_requires_review("scripts/sync-mosquitto-le-cert.sh")
              assert not path_requires_review("sms/src/main/resources/application.properties")
              assert not path_requires_review(
                  "java/agent-dispatcher/src/main/resources/application.properties"
              )
              assert not path_requires_review("README.md")
              renamed = matched_paths(
                  [
                      {
                          "filename": "README.md",
                          "previous_filename": "docker-compose.yml",
                      }
                  ]
              )
              assert renamed == ["docker-compose.yml"]

              state, desc = decide(pr(), [], [], [])
              assert (state, desc) == ("success", DESC_CLEAR)
              state, desc = decide(
                  pr(),
                  [{"filename": "java/dashboard/src/main/java/io/freedriver/app/security/CsrfFilter.java"}],
                  [],
                  [],
              )
              assert (state, desc) == ("failure", DESC_BOTH)
              state, desc = decide(pr(["manual-review"]), [], [], [])
              assert (state, desc) == ("failure", DESC_BOTH)
              state, desc = decide(
                  pr(["manual-review"]),
                  [],
                  [review(KAZE, "APPROVED", head, "2026-10-21T00:00:01Z")],
                  [],
              )
              assert (state, desc) == ("failure", DESC_VERDICT)
              state, desc = decide(
                  pr(["manual-review"]),
                  [],
                  [review(KAZE, "APPROVED", head, "2026-10-21T00:00:01Z")],
                  [comment(SECURITY, cleared)],
              )
              assert (state, desc) == ("success", DESC_OK)
              state, desc = decide(
                  pr(["manual-review"]),
                  [],
                  [review(KAZE, "APPROVED", head, "2026-10-21T00:00:01Z")],
                  [comment(SECURITY, "Commit: %s\nVerdict: cleared.\n" % other)],
              )
              assert (state, desc) == ("failure", DESC_VERDICT)
              state, desc = decide(
                  pr(["manual-review"]),
                  [],
                  [review(KAZE, "APPROVED", other, "2026-10-21T00:00:01Z")],
                  [comment(SECURITY, cleared)],
              )
              assert (state, desc) == ("failure", DESC_APPROVAL)
              state, desc = decide(
                  pr(["manual-review"]),
                  [],
                  [review(KAZE, "APPROVED", head, "2026-10-21T00:00:01Z")],
                  [comment("lonewatt-techops", "Security review\n" + cleared)],
              )
              assert state == "failure"
              state, desc = decide(
                  pr(["manual-review"]),
                  [],
                  [review(KAZE, "APPROVED", head, "2026-10-21T00:00:01Z")],
                  [comment("kazetsukaiyuni", "Security review\nCommit: %s\n" % head)],
              )
              assert state == "failure"
              state, desc = decide(
                  pr(["manual-review"]),
                  [],
                  [review(SECURITY, "APPROVED", head, "2026-10-21T00:00:01Z")],
                  [comment(SECURITY, cleared)],
              )
              assert (state, desc) == ("failure", DESC_APPROVAL)
              upper = "Commit: %s\r\nVerdict: cleared.\r\n" % (head.upper(),)
              assert verdict_comment(upper, head)
              assert not verdict_comment("Commit: %s\nVerdict: cleared\n" % head, head)
              assert not verdict_comment("Commit: %s\nVerdict: not cleared.\n" % head, head)
              assert not verdict_comment("See Verdict: cleared. today\nCommit: %s\n" % head, head)
              state, desc = decide(
                  pr(["manual-review"]),
                  [],
                  [
                      review(KAZE, "APPROVED", head, "2026-10-21T00:00:01Z"),
                      review(KAZE, "COMMENTED", head, "2026-10-21T00:00:02Z"),
                  ],
                  [comment(SECURITY, cleared)],
              )
              assert state == "success"
              state, desc = decide(
                  pr(["manual-review"]),
                  [],
                  [
                      review(KAZE, "APPROVED", head, "2026-10-21T00:00:01Z"),
                      review(KAZE, "CHANGES_REQUESTED", head, "2026-10-21T00:00:02Z"),
                  ],
                  [comment(SECURITY, cleared)],
              )
              assert state == "failure"
              state, desc = decide(
                  pr(["manual-review"]),
                  [],
                  [
                      review(KAZE, "CHANGES_REQUESTED", head, "2026-10-21T00:00:01Z"),
                      review(KAZE, "APPROVED", head, "2026-10-21T00:00:02Z"),
                  ],
                  [comment(SECURITY, cleared)],
              )
              assert state == "success"
              state, desc = decide(
                  pr(["manual-review"]),
                  [],
                  [review(KAZE, "DISMISSED", head, "2026-10-21T00:00:01Z")],
                  [comment(SECURITY, cleared)],
              )
              assert state == "failure"
              state, desc = decide(
                  pr(["manual-review"]),
                  [],
                  [
                      review(KAZE, "APPROVED", head, "2026-10-21T00:00:02Z"),
                      review(KAZE, "DISMISSED", other, "2026-10-21T00:00:03Z"),
                  ],
                  [comment(SECURITY, cleared)],
              )
              assert state == "success"
              assert RELAY_TITLE.fullmatch("relay-pr-124").group(1) == "124"
              assert RELAY_TITLE.fullmatch("relay-pr-") is None
              assert RELAY_TITLE.fullmatch("Fix the gate") is None
              side = pr(["manual-review"])
              side["base"] = {"ref": "feature"}
              assert not targets_main(side)
              print("self-check ok")

          def headers():
              return {
                  "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "manual-review-gate",
              }

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              last_error = None
              for attempt in range(3):
                  req = urllib.request.Request(url, data=data, method=method, headers=headers())
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          raw = resp.read()
                          parsed = json.loads(raw.decode()) if raw else None
                          return resp.status, parsed, resp.headers.get("Link")
                  except urllib.error.HTTPError as err:
                      detail = err.read().decode("utf-8", "replace")[:500]
                      if err.code in (502, 503, 504) and attempt < 2:
                          time.sleep(2)
                          continue
                      safe = url.split("?", 1)[0]
                      raise SystemExit("GitHub API %s %s -> %s %s" % (method, safe, err.code, detail))
                  except urllib.error.URLError as err:
                      last_error = err
                      if attempt < 2:
                          time.sleep(2)
                          continue
                      raise SystemExit("GitHub API %s failed: %s" % (method, err.reason))
              raise SystemExit("GitHub API %s failed: %s" % (method, last_error))

          def next_link(link):
              if not link:
                  return None
              for part in link.split(","):
                  bits = [bit.strip() for bit in part.split(";")]
                  if len(bits) < 2:
                      continue
                  if not any(bit == 'rel="next"' for bit in bits[1:]):
                      continue
                  url = bits[0]
                  if url.startswith("<") and url.endswith(">"):
                      return url[1:-1]
              return None

          def get_json(url):
              status, parsed, _link = request("GET", url)
              if status != 200:
                  raise SystemExit("GitHub API GET returned %s" % status)
              return parsed

          def get_list(url):
              items = []
              while url:
                  status, parsed, link = request("GET", url)
                  if status != 200:
                      raise SystemExit("GitHub API GET returned %s" % status)
                  if not isinstance(parsed, list):
                      raise SystemExit("GitHub API list was not a list")
                  items.extend(parsed)
                  url = next_link(link)
              return items

          def api(path):
              return "https://api.github.com" + path

          def find_pr_number(repo, run):
              sha = run.get("head_sha") or ""
              if not HEX_SHA.fullmatch(sha):
                  raise SystemExit("workflow_run head is not a commit SHA")
              branch = run.get("head_branch") or ""
              owner = (((run.get("head_repository") or {}).get("owner") or {}).get("login")) or ""
              found = []
              if owner and branch:
                  head = "%s:%s" % (
                      urllib.parse.quote(owner, safe=""),
                      urllib.parse.quote(branch, safe="/"),
                  )
                  found = get_list(api("/repos/%s/pulls?state=all&per_page=100&head=%s" % (repo, head)))
              matched = [item for item in found if ((item.get("head") or {}).get("sha")) == sha]
              if not matched:
                  try:
                      matched = get_list(api("/repos/%s/commits/%s/pulls" % (repo, sha)))
                  except SystemExit as err:
                      text = str(err)
                      if " -> 404 " not in text and " -> 422 " not in text:
                          raise
                      matched = []
              main_open = [
                  item
                  for item in matched
                  if ((item.get("base") or {}).get("ref")) == "main" and item.get("state") == "open"
              ]
              main_any = [item for item in matched if ((item.get("base") or {}).get("ref")) == "main"]
              pool = main_open or main_any or matched
              if len(pool) == 1:
                  return str(pool[0]["number"])
              if not pool:
                  raise SystemExit("no pull request for workflow_run %s" % sha)
              numbers = [item.get("number") for item in pool]
              raise SystemExit("multiple pull requests for %s: %s" % (sha, numbers))

          def resolve_pr_number(event, repo):
              name = os.environ["GITHUB_EVENT_NAME"]
              if name == "pull_request_target":
                  return str(event["pull_request"]["number"])
              if name == "issue_comment":
                  issue = event.get("issue") or {}
                  if "pull_request" not in issue:
                      return None
                  return str(issue["number"])
              if name == "workflow_run":
                  run = event["workflow_run"]
                  pulls = run.get("pull_requests") or []
                  if pulls and pulls[0].get("number"):
                      return str(pulls[0]["number"])
                  for key in ("display_title", "name"):
                      match = RELAY_TITLE.fullmatch((run.get(key) or "").strip())
                      if match:
                          return match.group(1)
                  return find_pr_number(repo, run)
              raise SystemExit("unexpected event %s" % name)

          def main():
              self_check()
              if os.environ.get("MANUAL_REVIEW_GATE_SELF_CHECK_ONLY") == "1":
                  return 0
              repo = os.environ["GITHUB_REPOSITORY"]
              if repo != "kazetsukaimiko/freedriver-web":
                  print("skip: repository")
                  return 0
              if not os.environ.get("GITHUB_TOKEN"):
                  raise SystemExit("GITHUB_TOKEN is empty")
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
                  event = json.load(handle)
              number = resolve_pr_number(event, repo)
              if number is None:
                  print("skip: not a pull request")
                  return 0
              if not re.fullmatch(r"[0-9]+", number):
                  raise SystemExit("pull request number is not numeric")
              pr = get_json(api("/repos/%s/pulls/%s" % (repo, number)))
              if not targets_main(pr):
                  print("skip: base is not main")
                  return 0
              head = ((pr.get("head") or {}).get("sha")) or ""
              if not HEX_SHA.fullmatch(head):
                  raise SystemExit("pull request head is not a commit SHA")
              files = get_list(api("/repos/%s/pulls/%s/files?per_page=100" % (repo, number)))
              reviews = get_list(api("/repos/%s/pulls/%s/reviews?per_page=100" % (repo, number)))
              comments = get_list(api("/repos/%s/issues/%s/comments?per_page=100" % (repo, number)))
              state, description = decide(pr, files, reviews, comments)
              paths = matched_paths(files)
              print(
                  "pr=%s head=%s state=%s paths=%s"
                  % (number, head, state, ",".join(paths[:30]))
              )
              print(description)
              latest = get_json(api("/repos/%s/pulls/%s" % (repo, number)))
              if ((latest.get("head") or {}).get("sha")) != head:
                  print("head moved; leaving the status to the newer run")
                  return 0
              target = "%s/%s/actions/runs/%s" % (
                  os.environ.get("GITHUB_SERVER_URL", "https://github.com"),
                  repo,
                  os.environ["GITHUB_RUN_ID"],
              )
              code, _body, _link = request(
                  "POST",
                  api("/repos/%s/statuses/%s" % (repo, head)),
                  {
                      "state": state,
                      "context": CONTEXT,
                      "description": description,
                      "target_url": target,
                  },
              )
              if code != 201:
                  raise SystemExit("status post returned %s" % code)
              print("posted %s" % state)
              return 0

          raise SystemExit(main())
          PY
