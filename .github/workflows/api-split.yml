name: api-split

# Posts the api-split commit status on the pull request head (#748).
# An API path is a file under an api package in src/main/java. Any other
# src/main file is the other side. The script applies those patterns.
# pull_request_target runs the base branch's workflow. The job checks out that
# same base and reads the changed-file list and label history through the API.
# It never checks out the head and never runs the pull request's code.
# The job's own check run is attached to the base SHA, so the result the
# ruleset reads is the commit status this posts on the head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

concurrency:
  group: api-split-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  api-split:
    runs-on: ubuntu-latest
    if: github.repository == 'kazetsukaimiko/freedriver-web'
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out the gate from the base branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Post the api-split status on the current head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/api_split_gate.py
