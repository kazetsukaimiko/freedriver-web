name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-freedriver
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'kazetsukaimiko/freedriver-web'
    environment: production
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Record the Keycloak provider source commit
        run: printf '%s\n' "$GITHUB_SHA" > .source-commit

      # Same scheme as autonomy mqtt-contract: YEAR-MONTH_rBUILD_NUM (UTC + github.run_number).
      # Example: 2026-08_r45. Not semver. Git poms stay 1.0.0-SNAPSHOT for local builds.
      - name: Stamp YEAR-MONTH_rBUILD_NUM
        run: |
          NEW_VERSION="$(date -u +%Y-%m)_r${{ github.run_number }}"
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
          printf '%s\n' "$NEW_VERSION" > BUILD_NUMBER
          echo "Deploy stamp: ${NEW_VERSION}"

      - name: Require deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          missing=0
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the required production environment secrets, then re-run."
            exit 1
          fi

      # Placeholder values satisfy compose interpolation on the runner only.
      - name: Build images on the runner
        run: |
          set -euo pipefail
          if [ -z "${NEW_VERSION}" ]; then
            echo "NEW_VERSION is empty; refusing to build"
            exit 1
          fi
          sudo mkdir -p /opt/freedriver-secrets
          printf '%s\n' '# placeholder for compose interpolation' | sudo tee /opt/freedriver-secrets/twilio-verify.env >/dev/null
          envfile="$RUNNER_TEMP/freedriver-deploy-build.env"
          # Placeholders only. Keep the file unreadable to other users on the runner.
          (umask 077; cat > "$envfile" <<EOF
          BUILD_NUMBER=${NEW_VERSION}
          SOURCE_COMMIT=${GITHUB_SHA}
          QUARKUS_OIDC_CREDENTIALS_SECRET=ci-not-a-secret
          KC_DB_PASSWORD=ci-not-a-secret
          KC_BOOTSTRAP_ADMIN_PASSWORD=ci-not-a-secret
          GF_SECURITY_ADMIN_PASSWORD=ci-not-a-secret
          FREEDRIVER_SMS_DAILY_SEND_CAP=1
          EOF
          )
          ENV_FILE="$envfile" \
            IMAGE_LIST="$RUNNER_TEMP/freedriver-images.txt" \
            BUILD_LIST="$RUNNER_TEMP/freedriver-build-services.txt" \
            python3 - <<'PY'
          import json, os, subprocess
          env = os.environ["ENV_FILE"]
          cmd = [
              "docker", "compose", "--env-file", env,
              "-f", "docker-compose.yml", "-f", "docker-compose.ghcr.yml",
              "config", "--format", "json",
          ]
          cfg = json.loads(subprocess.check_output(cmd, text=True))
          prefix = "ghcr.io/kazetsukaimiko/freedriver-web/"
          build_names = []
          images = []
          for name, svc in cfg["services"].items():
              image = svc.get("image")
              if not image:
                  raise SystemExit(f"{name} has no image")
              images.append(image)
              if image.startswith(prefix):
                  build = svc.get("build")
                  dockerfile = build.get("dockerfile") if isinstance(build, dict) else ""
                  if not dockerfile:
                      raise SystemExit(f"{name} is tagged for GHCR but has no Dockerfile")
                  build_names.append(name)
          if not build_names:
              raise SystemExit("no GHCR images to build")
          images.sort(key=lambda item: (not item.startswith(prefix), item))
          with open(os.environ["IMAGE_LIST"], "w", encoding="utf-8") as handle:
              handle.write("\n".join(images) + "\n")
          with open(os.environ["BUILD_LIST"], "w", encoding="utf-8") as handle:
              handle.write("\n".join(sorted(build_names)) + "\n")
          print("services:", " ".join(sorted(build_names)))
          PY
          while IFS= read -r service; do
            [ -n "$service" ] || continue
            docker compose --env-file "$envfile" \
              -f docker-compose.yml -f docker-compose.ghcr.yml \
              build "$service"
          done < "$RUNNER_TEMP/freedriver-build-services.txt"

      - name: Push images to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GHCR_TOKEN}" ]; then
            echo "GITHUB_TOKEN is empty; refusing to push"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/freedriver-build-services.txt" ]; then
            echo "build list is empty; refusing to push"
            exit 1
          fi
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          envfile="$RUNNER_TEMP/freedriver-deploy-build.env"
          while IFS= read -r service; do
            [ -n "$service" ] || continue
            docker compose --env-file "$envfile" \
              -f docker-compose.yml -f docker-compose.ghcr.yml \
              push "$service"
          done < "$RUNNER_TEMP/freedriver-build-services.txt"
          docker logout ghcr.io
          touch "$RUNNER_TEMP/freedriver-images-pushed"
          {
            echo "### Images pushed before the VPS was contacted"
            echo
            while IFS= read -r image; do
              case "$image" in
                ghcr.io/*) echo "- \`$image\`" ;;
              esac
            done < "$RUNNER_TEMP/freedriver-images.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # First contact with the VPS: pull the images. Rsync is the next step.
      - name: Pull images on the VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/freedriver-images-pushed" ]; then
            echo "images were not pushed; refusing to contact the VPS"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/freedriver-images.txt" ]; then
            echo "image list is empty; refusing to contact the VPS"
            exit 1
          fi
          if [ -z "${GHCR_TOKEN}" ]; then
            echo "GITHUB_TOKEN is empty; refusing to contact the VPS"
            exit 1
          fi
          pulls=""
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            pulls="${pulls}docker pull $(printf '%q' "$image")"$'\n'
          done < "$RUNNER_TEMP/freedriver-images.txt"
          # The job token is the docker password on stdin. logout runs on exit.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s" <<EOF
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s\n' $(printf '%q' "$GHCR_TOKEN") | docker login ghcr.io -u $(printf '%q' "$GITHUB_ACTOR") --password-stdin
          ${pulls}
          EOF
          touch "$RUNNER_TEMP/freedriver-images-pulled"

      - name: Rsync and start containers
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/freedriver-images-pulled" ]; then
            echo "images were not pulled; refusing to rsync"
            exit 1
          fi
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/freedriver-web/"

          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          # The deploy account owns the rsync target. Passwordless sudo is
          # /usr/bin/docker compose only. Storage directories are prepared on the host.
          for spec in \
            "472:472 /opt/freedriver-storage/grafana" \
            "10001:10001 /opt/freedriver-storage/loki" \
            "65534:65534 /opt/freedriver-storage/prometheus" \
            "1883:1883 /opt/freedriver-storage/mosquitto" \
            "185:0 /opt/freedriver-storage/sms"
          do
            want="${spec%% *}"
            path="${spec#* }"
            if [ ! -d "$path" ]; then
              echo "Missing storage directory: $path"
              exit 1
            fi
            got="$(stat -c '%u:%g' "$path")"
            if [ "$got" != "$want" ]; then
              echo "Storage owner for $path is $got, expected $want"
              exit 1
            fi
          done
          sms_mode="$(stat -c '%a' /opt/freedriver-storage/sms)"
          if [ "$sms_mode" != "700" ]; then
            echo "Storage mode for /opt/freedriver-storage/sms is $sms_mode, expected 700"
            exit 1
          fi
          cd /opt/freedriver-web
          if [ ! -f docker-compose.ghcr.yml ]; then
            echo "missing docker-compose.ghcr.yml; refusing to build on the VPS"
            exit 1
          fi
          build_number="$(tr -d '[:space:]' < BUILD_NUMBER)"
          if [ -f .source-commit ]; then
            source_commit="$(tr -d '[:space:]' < .source-commit)"
          else
            source_commit=unknown
          fi
          if [[ ! "$build_number" =~ ^[0-9]{4}-[0-9]{2}_r[0-9]+$ ]]; then
            echo "BUILD_NUMBER is not a deploy stamp"
            exit 1
          fi
          if [[ ! "$source_commit" =~ ^(unknown|[0-9a-f]{40})$ ]]; then
            echo "SOURCE_COMMIT is not a git sha"
            exit 1
          fi
          echo "Keycloak provider source commit: ${source_commit}"
          # Stamp and source commit travel in this file. The sudoers rule passes no caller environment.
          umask 077
          printf 'BUILD_NUMBER=%s\nSOURCE_COMMIT=%s\n' "$build_number" "$source_commit" > .build-number.env
          # Images are already on the VPS. Start them with --no-build --pull never.
          sudo -n /usr/bin/docker compose \
            --env-file /opt/freedriver-secrets/.env \
            --env-file .build-number.env \
            -f docker-compose.yml -f docker-compose.ghcr.yml \
            up -d --no-build --pull never
          sudo -n /usr/bin/docker compose \
            --env-file /opt/freedriver-secrets/.env \
            --env-file .build-number.env \
            -f docker-compose.yml -f docker-compose.ghcr.yml \
            up -d --force-recreate --no-deps --no-build --pull never caddy
          REMOTE

      - name: Name the Keycloak provider commit
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Keycloak provider source commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

      # Tag only after SSH deploy succeeds, and only on main (not PRs / other refs).
      - name: Tag successful deploy
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "${NEW_VERSION}" ]; then
            echo "NEW_VERSION is empty; refusing to tag"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEW_VERSION}" "${GITHUB_SHA}" -m "${NEW_VERSION}"
          git push origin "refs/tags/${NEW_VERSION}"
