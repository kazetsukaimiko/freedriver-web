name: Deploy

# Push runs when main changes version.txt, the release-please manifest, or the changelog.
# release-merge sets deploy when the head branch is release-please--branches--.
# workflow_dispatch deploys the ref chosen for the run.
on:
  push:
    branches: [main]
    paths:
      - version.txt
      - .release-please-manifest.json
      - java/dashboard/src/main/resources/changelog/CHANGELOG.md
  workflow_dispatch:

concurrency:
  # Release merges and manual runs share the deploy-freedriver group and cancel an older run in that group.
  # Every other push gets its own group. workflow_dispatch is evaluated before the commits context.
  group: ${{ (github.event_name == 'workflow_dispatch' || contains(toJSON(github.event.commits), 'release-please--branches--')) && 'deploy-freedriver' || format('deploy-skip-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' || contains(toJSON(github.event.commits), 'release-please--branches--') }}

jobs:
  release-merge:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.repository == 'kazetsukaimiko/freedriver-web'
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Detect the Release pull request merge
        id: gate
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deploy=false
          # A merge commit message contains the head branch name.
          # A squash or rebase merge is identified from the pull request head ref.
          if printf '%s\n' "$COMMIT_MESSAGE" | grep -F -q 'release-please--branches--'; then
            deploy=true
          else
            refs="$(gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[].head.ref')"
            if printf '%s\n' "$refs" | grep -F -q 'release-please--branches--'; then
              deploy=true
            fi
          fi
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
          if [ "$deploy" = true ]; then
            echo "Release pull request merge; Deploy will run"
          else
            echo "deploy output is false"
          fi

  deploy:
    needs: release-merge
    runs-on: ubuntu-latest
    if: >-
      !cancelled() &&
      github.repository == 'kazetsukaimiko/freedriver-web' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.release-merge.outputs.deploy == 'true'
      )
    environment: production
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Record the Keycloak provider source commit
        run: printf '%s\n' "$GITHUB_SHA" > .source-commit

      # Release PR writes YEAR-MONTH_rN to version.txt. Manual dispatch of a
      # ref without that stamp falls back to UTC year-month plus run_number.
      - name: Stamp YEAR-MONTH_rBUILD_NUM
        run: |
          file_stamp="$(tr -d '[:space:]' < version.txt || true)"
          if [[ "$file_stamp" =~ ^[0-9]{4}-[0-9]{2}_r[0-9]+$ ]]; then
            NEW_VERSION="$file_stamp"
          else
            NEW_VERSION="$(date -u +%Y-%m)_r${{ github.run_number }}"
          fi
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
          printf '%s\n' "$NEW_VERSION" > BUILD_NUMBER
          echo "Deploy stamp: ${NEW_VERSION}"

      - name: Require deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          missing=0
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the required production environment secrets, then re-run."
            exit 1
          fi

      # Compose interpolation on the runner uses the placeholder env file below. umask 077 keeps that file private to the job.
      - name: Build images on the runner
        run: |
          set -euo pipefail
          if [ -z "${NEW_VERSION}" ]; then
            echo "NEW_VERSION is empty; refusing to build"
            exit 1
          fi
          sudo mkdir -p /opt/freedriver-secrets
          printf '%s\n' '# placeholder for compose interpolation' | sudo tee /opt/freedriver-secrets/twilio-verify.env >/dev/null
          envfile="$RUNNER_TEMP/freedriver-deploy-build.env"
          (umask 077; cat > "$envfile" <<EOF
          BUILD_NUMBER=${NEW_VERSION}
          SOURCE_COMMIT=${GITHUB_SHA}
          QUARKUS_OIDC_CREDENTIALS_SECRET=ci-not-a-secret
          KC_DB_PASSWORD=ci-not-a-secret
          KC_BOOTSTRAP_ADMIN_PASSWORD=ci-not-a-secret
          GF_SECURITY_ADMIN_PASSWORD=ci-not-a-secret
          FREEDRIVER_SMS_DAILY_SEND_CAP=1
          EOF
          )
          ENV_FILE="$envfile" \
            IMAGE_LIST="$RUNNER_TEMP/freedriver-images.txt" \
            BUILD_LIST="$RUNNER_TEMP/freedriver-build-services.txt" \
            python3 - <<'PY'
          import json, os, subprocess
          env = os.environ["ENV_FILE"]
          cmd = [
              "docker", "compose", "--env-file", env,
              "-f", "docker-compose.yml", "-f", "docker-compose.ghcr.yml",
              "config", "--format", "json",
          ]
          cfg = json.loads(subprocess.check_output(cmd, text=True))
          prefix = "ghcr.io/kazetsukaimiko/freedriver-web/"
          build_names = []
          images = []
          for name, svc in cfg["services"].items():
              image = svc.get("image")
              if not image:
                  raise SystemExit(f"{name} has no image")
              images.append(image)
              if image.startswith(prefix):
                  build = svc.get("build")
                  dockerfile = build.get("dockerfile") if isinstance(build, dict) else ""
                  if not dockerfile:
                      raise SystemExit(f"{name} is tagged for GHCR but has no Dockerfile")
                  build_names.append(name)
          if not build_names:
              raise SystemExit("no GHCR images to build")
          images.sort(key=lambda item: (not item.startswith(prefix), item))
          with open(os.environ["IMAGE_LIST"], "w", encoding="utf-8") as handle:
              handle.write("\n".join(images) + "\n")
          with open(os.environ["BUILD_LIST"], "w", encoding="utf-8") as handle:
              handle.write("\n".join(sorted(build_names)) + "\n")
          print("services:", " ".join(sorted(build_names)))
          PY
          while IFS= read -r service; do
            [ -n "$service" ] || continue
            docker compose --env-file "$envfile" \
              -f docker-compose.yml -f docker-compose.ghcr.yml \
              build "$service"
          done < "$RUNNER_TEMP/freedriver-build-services.txt"

      - name: Push images to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GHCR_TOKEN}" ]; then
            echo "GITHUB_TOKEN is empty; refusing to push"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/freedriver-build-services.txt" ]; then
            echo "build list is empty; refusing to push"
            exit 1
          fi
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          envfile="$RUNNER_TEMP/freedriver-deploy-build.env"
          while IFS= read -r service; do
            [ -n "$service" ] || continue
            docker compose --env-file "$envfile" \
              -f docker-compose.yml -f docker-compose.ghcr.yml \
              push "$service"
          done < "$RUNNER_TEMP/freedriver-build-services.txt"
          docker logout ghcr.io
          touch "$RUNNER_TEMP/freedriver-images-pushed"
          {
            echo "### Images pushed before the VPS was contacted"
            echo
            while IFS= read -r image; do
              case "$image" in
                ghcr.io/*) echo "- \`$image\`" ;;
              esac
            done < "$RUNNER_TEMP/freedriver-images.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Copies the tree to $HOME/deploy-stage. sudo /usr/bin/docker compose pulls the public GHCR packages there.
      - name: Pull images on the VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/freedriver-images-pushed" ]; then
            echo "images were not pushed; refusing to contact the VPS"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/freedriver-images.txt" ]; then
            echo "image list is empty; refusing to contact the VPS"
            exit 1
          fi
          if [ -z "${NEW_VERSION}" ]; then
            echo "NEW_VERSION is empty; refusing to contact the VPS"
            exit 1
          fi
          if [[ ! "$NEW_VERSION" =~ ^[0-9]{4}-[0-9]{2}_r[0-9]+$ ]]; then
            echo "NEW_VERSION is not a deploy stamp"
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA is not a git sha"
            exit 1
          fi
          stage_dir="$(ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'printf %s "$HOME/deploy-stage"')"
          if [[ ! "$stage_dir" =~ ^/[A-Za-z0-9._/-]+/deploy-stage$ ]] || [[ "$stage_dir" == *..* ]]; then
            echo "staging path is not an absolute deploy-stage directory"
            exit 1
          fi
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p -m 700 $(printf '%q' "$stage_dir") && chmod 700 $(printf '%q' "$stage_dir")"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${stage_dir}/"
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- $(printf '%q' "$NEW_VERSION") $(printf '%q' "$GITHUB_SHA")" <<'REMOTE'
          set -euo pipefail
          build_number="$1"
          source_commit="$2"
          if [[ ! "$build_number" =~ ^[0-9]{4}-[0-9]{2}_r[0-9]+$ ]]; then
            echo "BUILD_NUMBER is not a deploy stamp"
            exit 1
          fi
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SOURCE_COMMIT is not a git sha"
            exit 1
          fi
          cd "$HOME/deploy-stage"
          if [ ! -f docker-compose.ghcr.yml ]; then
            echo "missing docker-compose.ghcr.yml; refusing to pull on the VPS"
            exit 1
          fi
          umask 077
          printf 'BUILD_NUMBER=%s\nSOURCE_COMMIT=%s\n' "$build_number" "$source_commit" > .build-number.env
          # pull --policy always refreshes every service image, including tags already on the host.
          sudo -n /usr/bin/docker compose \
            --env-file /opt/freedriver-secrets/.env \
            --env-file .build-number.env \
            -f docker-compose.yml -f docker-compose.ghcr.yml \
            pull --policy always
          REMOTE
          touch "$RUNNER_TEMP/freedriver-images-pulled"

      - name: Rsync and start containers
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/freedriver-images-pulled" ]; then
            echo "images were not pulled; refusing to rsync"
            exit 1
          fi
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/freedriver-web/"

          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          # The deploy account owns /opt/freedriver-web. Storage directories are prepared on the host.
          for spec in \
            "472:472 /opt/freedriver-storage/grafana" \
            "10001:10001 /opt/freedriver-storage/loki" \
            "65534:65534 /opt/freedriver-storage/prometheus" \
            "1883:1883 /opt/freedriver-storage/mosquitto" \
            "185:0 /opt/freedriver-storage/sms"
          do
            want="${spec%% *}"
            path="${spec#* }"
            if [ ! -d "$path" ]; then
              echo "Missing storage directory: $path"
              exit 1
            fi
            got="$(stat -c '%u:%g' "$path")"
            if [ "$got" != "$want" ]; then
              echo "Storage owner for $path is $got, expected $want"
              exit 1
            fi
          done
          sms_mode="$(stat -c '%a' /opt/freedriver-storage/sms)"
          if [ "$sms_mode" != "700" ]; then
            echo "Storage mode for /opt/freedriver-storage/sms is $sms_mode, expected 700"
            exit 1
          fi
          cd /opt/freedriver-web
          if [ ! -f docker-compose.ghcr.yml ]; then
            echo "missing docker-compose.ghcr.yml; refusing to build on the VPS"
            exit 1
          fi
          build_number="$(tr -d '[:space:]' < BUILD_NUMBER)"
          if [ -f .source-commit ]; then
            source_commit="$(tr -d '[:space:]' < .source-commit)"
          else
            source_commit=unknown
          fi
          if [[ ! "$build_number" =~ ^[0-9]{4}-[0-9]{2}_r[0-9]+$ ]]; then
            echo "BUILD_NUMBER is not a deploy stamp"
            exit 1
          fi
          if [[ ! "$source_commit" =~ ^(unknown|[0-9a-f]{40})$ ]]; then
            echo "SOURCE_COMMIT is not a git sha"
            exit 1
          fi
          echo "Keycloak provider source commit: ${source_commit}"
          # sudo /usr/bin/docker compose reads BUILD_NUMBER and SOURCE_COMMIT from .build-number.env.
          umask 077
          printf 'BUILD_NUMBER=%s\nSOURCE_COMMIT=%s\n' "$build_number" "$source_commit" > .build-number.env
          # Starts the stack from the images the previous step pulled.
          sudo -n /usr/bin/docker compose \
            --env-file /opt/freedriver-secrets/.env \
            --env-file .build-number.env \
            -f docker-compose.yml -f docker-compose.ghcr.yml \
            up -d --no-build --pull never
          sudo -n /usr/bin/docker compose \
            --env-file /opt/freedriver-secrets/.env \
            --env-file .build-number.env \
            -f docker-compose.yml -f docker-compose.ghcr.yml \
            up -d --force-recreate --no-deps --no-build --pull never caddy
          REMOTE

      - name: Name the Keycloak provider commit
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Keycloak provider source commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

      # Pushes an annotated tag of the deploy stamp after the SSH deploy on main.
      - name: Tag successful deploy
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "${NEW_VERSION}" ]; then
            echo "NEW_VERSION is empty; refusing to tag"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEW_VERSION}" "${GITHUB_SHA}" -m "${NEW_VERSION}"
          git push origin "refs/tags/${NEW_VERSION}"
