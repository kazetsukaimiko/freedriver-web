name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-freedriver
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'kazetsukaimiko/freedriver-web'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same scheme as autonomy mqtt-contract: YEAR-MONTH_rBUILD_NUM (UTC + github.run_number).
      # Example: 2026-08_r45. Not semver. Git poms stay 1.0.0-SNAPSHOT for local builds.
      - name: Stamp YEAR-MONTH_rBUILD_NUM
        run: |
          NEW_VERSION="$(date -u +%Y-%m)_r${{ github.run_number }}"
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
          printf '%s\n' "$NEW_VERSION" > BUILD_NUMBER
          echo "Deploy stamp: ${NEW_VERSION}"

      - name: Require deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          missing=0
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the required repository secrets, then re-run."
            exit 1
          fi

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/freedriver-web/"

          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo mkdir -p /opt/freedriver-storage/grafana /opt/freedriver-storage/loki /opt/freedriver-storage/prometheus /opt/freedriver-storage/mosquitto
          sudo chown 472:472 /opt/freedriver-storage/grafana
          sudo chown 10001:10001 /opt/freedriver-storage/loki
          sudo chown 65534:65534 /opt/freedriver-storage/prometheus
          sudo chown 1883:1883 /opt/freedriver-storage/mosquitto
          cd /opt/freedriver-web
          export BUILD_NUMBER="$(cat BUILD_NUMBER)"
          docker compose --env-file /opt/freedriver-secrets/.env up -d --pull always --build
          docker compose --env-file /opt/freedriver-secrets/.env up -d --force-recreate --no-deps caddy
          if [[ -x /opt/freedriver-web/scripts/sync-mosquitto-le.sh ]]; then
            if /opt/freedriver-web/scripts/sync-mosquitto-le.sh; then
              echo "Mosquitto LE cert synced."
            else
              rc=$?
              if [[ "$rc" -eq 2 ]]; then
                echo "Caddy has not issued mqtt.freedriver.io yet; leaving Mosquitto certs in place."
              else
                exit "$rc"
              fi
            fi
          fi
          REMOTE

      # Tag only after SSH deploy succeeds, and only on main (not PRs / other refs).
      - name: Tag successful deploy
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "${NEW_VERSION}" ]; then
            echo "NEW_VERSION is empty; refusing to tag"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEW_VERSION}" "${GITHUB_SHA}" -m "${NEW_VERSION}"
          git push origin "refs/tags/${NEW_VERSION}"
