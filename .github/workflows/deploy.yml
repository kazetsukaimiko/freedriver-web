name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-freedriver
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'kazetsukaimiko/freedriver-web'
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Record the Keycloak provider source commit
        run: printf '%s\n' "$GITHUB_SHA" > .source-commit

      # Same scheme as autonomy mqtt-contract: YEAR-MONTH_rBUILD_NUM (UTC + github.run_number).
      # Example: 2026-08_r45. Not semver. Git poms stay 1.0.0-SNAPSHOT for local builds.
      - name: Stamp YEAR-MONTH_rBUILD_NUM
        run: |
          NEW_VERSION="$(date -u +%Y-%m)_r${{ github.run_number }}"
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
          printf '%s\n' "$NEW_VERSION" > BUILD_NUMBER
          echo "Deploy stamp: ${NEW_VERSION}"

      - name: Require deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          missing=0
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the required production environment secrets, then re-run."
            exit 1
          fi

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/freedriver-web/"

          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          # The deploy account owns the rsync target. Passwordless sudo is
          # /usr/bin/docker compose only. Storage directories are prepared on the host.
          for spec in \
            "472:472 /opt/freedriver-storage/grafana" \
            "10001:10001 /opt/freedriver-storage/loki" \
            "65534:65534 /opt/freedriver-storage/prometheus" \
            "1883:1883 /opt/freedriver-storage/mosquitto" \
            "185:0 /opt/freedriver-storage/sms"
          do
            want="${spec%% *}"
            path="${spec#* }"
            if [ ! -d "$path" ]; then
              echo "Missing storage directory: $path"
              exit 1
            fi
            got="$(stat -c '%u:%g' "$path")"
            if [ "$got" != "$want" ]; then
              echo "Storage owner for $path is $got, expected $want"
              exit 1
            fi
          done
          sms_mode="$(stat -c '%a' /opt/freedriver-storage/sms)"
          if [ "$sms_mode" != "700" ]; then
            echo "Storage mode for /opt/freedriver-storage/sms is $sms_mode, expected 700"
            exit 1
          fi
          cd /opt/freedriver-web
          build_number="$(tr -d '[:space:]' < BUILD_NUMBER)"
          if [ -f .source-commit ]; then
            source_commit="$(tr -d '[:space:]' < .source-commit)"
          else
            source_commit=unknown
          fi
          if [[ ! "$build_number" =~ ^[0-9]{4}-[0-9]{2}_r[0-9]+$ ]]; then
            echo "BUILD_NUMBER is not a deploy stamp"
            exit 1
          fi
          if [[ ! "$source_commit" =~ ^(unknown|[0-9a-f]{40})$ ]]; then
            echo "SOURCE_COMMIT is not a git sha"
            exit 1
          fi
          echo "Keycloak provider source commit: ${source_commit}"
          # Stamp and source commit travel in this file. The sudoers rule passes no caller environment.
          umask 077
          printf 'BUILD_NUMBER=%s\nSOURCE_COMMIT=%s\n' "$build_number" "$source_commit" > .build-number.env
          # --build rebuilds every image, including keycloak (SPI jar and theme) and sms.
          sudo -n /usr/bin/docker compose \
            --env-file /opt/freedriver-secrets/.env \
            --env-file .build-number.env \
            up -d --pull always --build
          sudo -n /usr/bin/docker compose \
            --env-file /opt/freedriver-secrets/.env \
            --env-file .build-number.env \
            up -d --force-recreate --no-deps caddy
          REMOTE

      - name: Name the Keycloak provider commit
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Keycloak provider source commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

      # Tag only after SSH deploy succeeds, and only on main (not PRs / other refs).
      - name: Tag successful deploy
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "${NEW_VERSION}" ]; then
            echo "NEW_VERSION is empty; refusing to tag"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEW_VERSION}" "${GITHUB_SHA}" -m "${NEW_VERSION}"
          git push origin "refs/tags/${NEW_VERSION}"
