name: ci-notify-openbot

# After another workflow in this repo completes, POST a signed OpenBot
# envelope. Native GitHub webhook JSON is 400 on signal.openbot.run.
# GitHub does not re-enter this workflow via workflow_run.
on:
  workflow_run:
    workflows:
      - CI
      - commitlint
      - Commitlint
      - release
      - Release
      - Deploy
      - Grok review
      - Publish SMS
    types: [completed]

jobs:
  notify:
    if: github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: POST OpenBot
        env:
          OPENBOT_WEBHOOK_URL: ${{ secrets.OPENBOT_WEBHOOK_URL }}
          OPENBOT_SIGNING_SECRET: ${{ secrets.OPENBOT_SIGNING_SECRET }}
          GH_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import hashlib, hmac, json, os, sys, time, urllib.error, urllib.request, uuid
          from datetime import datetime, timezone

          url = os.environ.get("OPENBOT_WEBHOOK_URL", "")
          secret = os.environ.get("OPENBOT_SIGNING_SECRET", "")
          if not url or not secret:
              print("missing OPENBOT_WEBHOOK_URL or OPENBOT_SIGNING_SECRET", file=sys.stderr)
              sys.exit(2)

          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          pr_number = None
          pr_url = None
          pr_author = None
          api = f"https://api.github.com/repos/{repo}/commits/{sha}/pulls"
          req = urllib.request.Request(
              api,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": "ci-notify-openbot",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  prs = json.load(resp)
              if prs:
                  pr_number = prs[0].get("number")
                  pr_url = prs[0].get("html_url")
                  user = prs[0].get("user") or {}
                  pr_author = user.get("login")
          except urllib.error.HTTPError as exc:
              print(f"commit pulls {exc.code}", file=sys.stderr)

          payload = {
              "type": "ci-run-completed",
              "occurredAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "data": {
                  "repo": repo,
                  "workflow": os.environ.get("WORKFLOW") or "",
                  "conclusion": os.environ.get("CONCLUSION") or "",
                  "html_url": os.environ.get("HTML_URL") or "",
                  "run_id": os.environ.get("RUN_ID") or "",
                  "sha": sha,
                  "event": os.environ.get("EVENT_NAME") or "",
                  "actor": os.environ.get("ACTOR") or "",
                  "head_branch": os.environ.get("HEAD_BRANCH") or "",
                  "pr_number": pr_number,
                  "pr_url": pr_url,
                  "pr_author": pr_author,
              },
          }
          body = json.dumps(payload, separators=(",", ":"), ensure_ascii=True).encode()
          ts = str(int(time.time()))
          delivery = "d" + uuid.uuid4().hex
          mac = hmac.new(
              secret.encode(),
              f"{ts}.{delivery}.".encode() + body,
              hashlib.sha256,
          ).hexdigest()
          post = urllib.request.Request(
              url,
              data=body,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "x-openbot-timestamp": ts,
                  "x-openbot-delivery-id": delivery,
                  "x-openbot-signature": f"sha256={mac}",
                  "User-Agent": "ci-notify-openbot",
              },
          )
          try:
              with urllib.request.urlopen(post, timeout=30) as resp:
                  code = resp.status
          except urllib.error.HTTPError as exc:
              code = exc.code
              print(exc.read()[:500], file=sys.stderr)
          print(json.dumps({"status": code, "repo": repo, "conclusion": payload["data"]["conclusion"], "pr_author": pr_author}))
          sys.exit(0 if code in (200, 202) else 2)
          PY
