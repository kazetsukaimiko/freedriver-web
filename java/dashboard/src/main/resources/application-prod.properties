# Prod profile. The packaged app activates this profile; compose does not set appliance keys.
# The practice list is off. Names come from broker state.
# The instance id and the api password are host files, not this repo.
# live-commands stays false. Absent host files leave the list empty.
freedriver.appliances.enabled=true
freedriver.appliances.mock=false
freedriver.appliances.live-commands=false
freedriver.appliances.mock-refresh=false
freedriver.mqtt.instance-ids-file=/opt/freedriver-secrets/mosquitto/acl
freedriver.mqtt.password-file=/opt/freedriver-secrets/mosquitto/api.pass
