# Prod profile. The packaged app activates this profile; compose does not set appliance keys.
# The practice list is on. Nothing here opens a broker: live-commands stays false.
# Turn the practice list off with one setting, freedriver.appliances.mock=false.
# Leave enabled true so the API stays up when that happens.
freedriver.appliances.enabled=true
freedriver.appliances.mock=true
freedriver.appliances.live-commands=false
freedriver.appliances.mock-refresh=true
