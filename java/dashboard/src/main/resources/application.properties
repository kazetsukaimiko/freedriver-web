# Deploy stamps quarkus.application.version from version.txt. Public GET /api/build returns it.
# Quinoa builds and serves the React SPA in src/main/webui.
# Node 22.14+ is required by the current Vite React starter.
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=22.14.0
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/q,/login,/logout,/sign-in,/autonomy

# Prometheus scrapes dashboard:8080/q/metrics. Grafana reads Prometheus. #345.
quarkus.micrometer.enabled=true

# OIDC, HTTP auth permissions, and the appliances command rate limit load from
# auth-policy.properties. AuthPolicyConfigSource reads that file. AuthPolicyLockInterceptor
# keeps those keys when another source has a higher ordinal. AuthPolicyLockGuard keeps
# them when a later interceptor replaces the value. Appliance control
# stays off in this default profile. The prod profile turns live-commands on.
# CI and tests lock the default profile.
# CSRF Secure is a profile flag. The app sees plain HTTP behind the TLS terminator,
# so the request scheme is not the flag. %dev stays off so quarkus:dev on
# http://localhost and http://127.0.0.1 can store the cookie.
freedriver.csrf.cookie-secure=false
%dev.freedriver.csrf.cookie-secure=false
%prod.freedriver.csrf.cookie-secure=true

# Login links use this host only. The number is the URL fragment, never the query.
freedriver.public-base-url=https://app.freedriver.io

# Shared compose secret for the autonomy MCP process. Empty disables that identity.
# Caddy strips the matching request headers from the public reverse_proxy.
freedriver.mcp.internal-secret=${FREEDRIVER_MCP_INTERNAL_SECRET:}
%test.freedriver.mcp.internal-secret=test-internal-secret

# The browser talks to this HTTP API only; MQTT stays server-side. CORS is an explicit origin allowlist.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://app.freedriver.io
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-csrf-token
quarkus.http.cors.exposed-headers=content-type
quarkus.http.cors.access-control-allow-credentials=true

# ---------------------------------------------------------------------------
# Appliances map/command API
# Default: resource is inactive (404, AppliancesDisabledFilter) and live MQTT publish is off.
# Prod profile turns live-commands on. Dev and test keep it off and use mock.
# ---------------------------------------------------------------------------
freedriver.appliances.enabled=false
freedriver.appliances.live-commands=false
freedriver.appliances.mock=false
freedriver.appliances.stale-after=20s
freedriver.appliances.command-timeout=${FREEDRIVER_COMMAND_TIMEOUT:5s}
freedriver.appliances.command-timeout-max=30s
freedriver.appliances.mock-refresh=false

# Live MQTT adapter (#40). Command publish is on when live-commands is on.
# Logger io.freedriver.mqtt records connection, resubscribe, state, and commands.
# Per-message state is DEBUG. A once-a-minute INFO summary is the arrival check.
# The broker is the compose-network host mosquitto over MQTTS 8883. MqttBrokers refuses freedriver.io hostnames and requires TLS on 8883.
freedriver.mqtt.host=mosquitto
freedriver.mqtt.port=8883
freedriver.mqtt.tls=true
freedriver.mqtt.username=api
# CA certificate file read by the MQTT client trust store when live-commands is true.
freedriver.mqtt.trust-certificate=/opt/freedriver-secrets/mqtt-internal/ca.crt
# Password and instance ids, when set:
# FREEDRIVER_MQTT_API_PASSWORD, FREEDRIVER_MQTT_INSTANCE_IDS

# quarkus:dev — MockAutonomy feeds the ApplianceControl bus in-process; the app runs standalone.
# /api/hello and /api/health stay 200. Turn mock off with freedriver.appliances.mock=false.
# Dev auth is DevOpenAuthAugmentor (io.freedriver.app.security). Authorization stays on:
# quarkus.security.auth.enabled-in-dev-mode keeps its default (true), so @RolesAllowed runs.
%dev.freedriver.appliances.enabled=true
%dev.freedriver.appliances.live-commands=false
%dev.freedriver.appliances.mock=true
%dev.freedriver.appliances.mock-refresh=true
%dev.quarkus.http.cors.origins=https://app.freedriver.io,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173

# Tests — mock fixture, auth required via @TestSecurity (anonymous requests get 401/403).
%test.freedriver.appliances.enabled=true
%test.freedriver.appliances.live-commands=false
%test.freedriver.appliances.mock=true
%test.freedriver.appliances.mock-refresh=false
%test.freedriver.appliances.command-timeout=200ms
%test.quarkus.http.test-port=0

# Instances collection. Dev and test start a Mongo container through Dev Services,
# on the compose image tag. The running app takes QUARKUS_MONGODB_CONNECTION_STRING
# from the environment (compose sets it). The driver logger stays at WARN so a house
# document, including its broker secret, is not written out.
quarkus.mongodb.devservices.enabled=false
%dev.quarkus.mongodb.devservices.enabled=true
%test.quarkus.mongodb.devservices.enabled=true
quarkus.mongodb.devservices.image-name=mongo:8.0
# Same workaround as the compose service: without it mongo:8.0 exits before it accepts
# connections on the CI kernel.
quarkus.mongodb.devservices.container-env.GLIBC_TUNABLES=glibc.pthread.rseq=1
quarkus.mongodb.database=freedriver
# Each test start gets its own database, so one profile's rows do not reach another.
%test.quarkus.mongodb.database=freedriver-test-${quarkus.uuid}
# Appliance roster rows live in appliance-roster.
quarkus.log.category."org.mongodb.driver".level=WARN

# One managed Redis client (quarkus-redis-client). Production uses the compose Redis host; it is not
# a public port. Dev and test start a Redis container through Dev Services, on the compose image tag.
%prod.quarkus.redis.hosts=${FREEDRIVER_REDIS_URL:redis://redis:6379}
quarkus.redis.devservices.image-name=redis:7.4-alpine
# Rate-limit windows are keys freedriver:rate:dashboard:*.
freedriver.rate-limit.namespace=dashboard

# sms REST clients (SmsPhones, SmsInvite). Compose sets FREEDRIVER_SMS_BASE_URL on the internal network.
# The shared secret is sms.otp.shared-secret (SMS_OTP_SHARED_SECRET); SmsSecretHeaders adds it.
quarkus.rest-client.sms.url=${freedriver.sms.base-url:http://sms:8080}
quarkus.rest-client.sms.connect-timeout=5000
quarkus.rest-client.sms.read-timeout=5000

# Keycloak admin clients. The default Keycloak bean is the freedriver-instances service account
# (house users and mqtt-instance); InviteAdminProducer builds freedriver-invite (phone-sign-in).
# Each client fetches and reuses its own client-credentials token. The secrets come from
# freedriver.instances.client-secret and freedriver.invite.client-secret in auth-policy.properties.
# The extension refuses a blank secret at startup, but a blank secret must not stop the dashboard,
# so the admin client reads FREEDRIVER_INSTANCES_CLIENT_SECRET (the same env value as
# freedriver.instances.client-secret) and an unset value reads as the word "unset".
# KeycloakInstanceIdentity refuses every call while that secret is blank, so the word is never sent.
freedriver.keycloak.server-url=https://auth.freedriver.io
quarkus.keycloak.admin-client.server-url=${freedriver.keycloak.server-url}
quarkus.keycloak.admin-client.realm=freedriver
quarkus.keycloak.admin-client.client-id=${freedriver.instances.client-id}
quarkus.keycloak.admin-client.client-secret=${FREEDRIVER_INSTANCES_CLIENT_SECRET:unset}
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS
# The SMS SPI's invite-account resource, with the token from the invite OIDC client.
quarkus.rest-client.keycloak-invite.url=${freedriver.keycloak.server-url}
quarkus.rest-client.keycloak-invite.connect-timeout=5000
quarkus.rest-client.keycloak-invite.read-timeout=5000
quarkus.oidc-client.invite.auth-server-url=${freedriver.keycloak.server-url}/realms/${quarkus.keycloak.admin-client.realm}
quarkus.oidc-client.invite.discovery-enabled=false
quarkus.oidc-client.invite.token-path=protocol/openid-connect/token
quarkus.oidc-client.invite.client-id=${freedriver.invite.client-id}
quarkus.oidc-client.invite.credentials.secret=${freedriver.invite.client-secret:}
quarkus.oidc-client.invite.grant.type=client

# The dispatcher owns the dispatch assignments. /api/jobs reads /api/dispatcher/admin/jobs as the portal's service
# account: Keycloak client freedriver-portal-jobs, realm role dispatcher-admin. The portal-jobs OIDC
# client fetches and reuses the client-credentials token. FREEDRIVER_PORTAL_JOBS_CLIENT_SECRET comes
# from /opt/freedriver-secrets/keycloak-freedriver-portal-jobs.env, which the provision script writes.
quarkus.rest-client.dispatcher.url=${freedriver.dispatcher.url:http://agent-dispatcher:8080}
quarkus.rest-client.dispatcher.connect-timeout=5000
quarkus.rest-client.dispatcher.read-timeout=10000
quarkus.oidc-client.portal-jobs.auth-server-url=${freedriver.keycloak.server-url}/realms/${quarkus.keycloak.admin-client.realm}
quarkus.oidc-client.portal-jobs.discovery-enabled=false
quarkus.oidc-client.portal-jobs.token-path=protocol/openid-connect/token
quarkus.oidc-client.portal-jobs.client-id=freedriver-portal-jobs
quarkus.oidc-client.portal-jobs.credentials.secret=${FREEDRIVER_PORTAL_JOBS_CLIENT_SECRET:}
quarkus.oidc-client.portal-jobs.grant.type=client
# Delayed switches are rows in scheduled-switches. Each replica claims due rows with a 60-second lease.
# The poll setting turns the Quarkus scheduler on or off; tests run passes directly.
freedriver.scheduled-switches.poll=true
%test.freedriver.scheduled-switches.poll=false
quarkus.scheduler.enabled=${freedriver.scheduled-switches.poll:true}
