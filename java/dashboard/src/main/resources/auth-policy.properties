# OIDC BFF, HTTP auth permissions, and the appliances command rate limit. Code owners review this file.
# OIDC is on in prod and off in the default, dev, and test profiles.
# Compose injects QUARKUS_OIDC_AUTH_SERVER_URL / CLIENT_ID / CREDENTIALS_SECRET.
# The client secret lives only in server env, outside git and the webui. The prod secret has
# no default, so the prod app fails to start when it is unset.

quarkus.oidc.enabled=false
%prod.quarkus.oidc.enabled=true
quarkus.keycloak.devservices.enabled=false
quarkus.oidc.devservices.enabled=false
quarkus.oidc.application-type=web-app
quarkus.oidc.auth-server-url=https://auth.freedriver.io/realms/freedriver
quarkus.oidc.client-id=freedriver-api
quarkus.oidc.credentials.secret=${QUARKUS_OIDC_CREDENTIALS_SECRET:}
%prod.quarkus.oidc.credentials.secret=${QUARKUS_OIDC_CREDENTIALS_SECRET}
# Invite service account. Non-prod may be empty. Prod has no default, so startup
# fails when it is unset, and a blank value fails startup. Compose refuses an empty value.
freedriver.invite.client-id=freedriver-invite
freedriver.invite.client-secret=${FREEDRIVER_INVITE_CLIENT_SECRET:}
%prod.freedriver.invite.client-secret=${FREEDRIVER_INVITE_CLIENT_SECRET}
# quarkus-oidc always sets the session cookie HttpOnly (OidcUtils.createCookie).
quarkus.oidc.authentication.cookie-same-site=lax
quarkus.oidc.authentication.cookie-force-secure=true
quarkus.oidc.authentication.java-script-auto-redirect=false
# Caddy terminates TLS and forwards plain HTTP, so prod builds the Keycloak return address
# with https to match the client's registered redirect URIs.
%prod.quarkus.oidc.authentication.force-redirect-https-scheme=true
quarkus.oidc.roles.source=accesstoken
# RP-initiated logout. Prod post_logout_redirect_uri is exactly https://app.freedriver.io/
# (Keycloak client freedriver-api, one address, no wildcard).
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/

# Map/command and changelog fail-closed when a session is required. SPA, hello, health, and build
# stay public while OIDC is off. /login is the OIDC start; document redirect is gated on oidc.enabled.
quarkus.http.auth.permission.public.paths=/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.appliances.paths=/api/appliances,/api/appliances/*
quarkus.http.auth.permission.appliances.policy=authenticated
quarkus.http.auth.permission.changelog.paths=/api/changelog,/api/changelog/*
quarkus.http.auth.permission.changelog.policy=authenticated
quarkus.http.auth.permission.login.paths=/login
quarkus.http.auth.permission.login.policy=authenticated
quarkus.http.auth.permission.logout.paths=/logout
quarkus.http.auth.permission.logout.policy=authenticated
# Admin invite and phone routes need a session. /api/invites/use is an exact path,
# so /api/invites/* does not swallow the anonymous redeem.
quarkus.http.auth.permission.invites.paths=/api/invites,/api/invites/*
quarkus.http.auth.permission.invites.policy=authenticated
quarkus.http.auth.permission.invite-use.paths=/api/invites/use
quarkus.http.auth.permission.invite-use.policy=permit
quarkus.http.auth.permission.phones.paths=/api/phones,/api/phones/*
quarkus.http.auth.permission.phones.policy=authenticated

# Command posts. The test profile keeps the same window and a smaller permit count.
freedriver.appliances.rate-limit.permits=30
freedriver.appliances.rate-limit.window=60s
%test.freedriver.appliances.rate-limit.permits=8
%test.freedriver.appliances.rate-limit.window=60s

%dev.quarkus.oidc.enabled=false
%test.quarkus.oidc.enabled=false
