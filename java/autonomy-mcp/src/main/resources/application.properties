# JAX-RS interfaces live in autonomy-mcp-api. Index that jar or Quarkus misses
# the security annotations at build time.
quarkus.index-dependency.autonomy-mcp-api.group-id=io.freedriver
quarkus.index-dependency.autonomy-mcp-api.artifact-id=autonomy-mcp-api

# Bearer resource server. Keycloak is the issuer. Prod turns OIDC on; default, dev,
# and test stay off so the app starts locally with no secrets.
quarkus.oidc.enabled=false
%prod.quarkus.oidc.enabled=true
quarkus.keycloak.devservices.enabled=false
quarkus.oidc.devservices.enabled=false
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=https://auth.freedriver.io/realms/freedriver
quarkus.oidc.client-id=freedriver-grok-mcp
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.token.audience=https://app.freedriver.io/autonomy/mcp
# Do not pin a single azp. The public client is freedriver-grok-mcp, and a
# Dynamic Client Registration client uses its own client id. Audience and
# the mcp-user role stay the gate.
quarkus.oidc.token.subject-required=true
quarkus.tls.trust-all=false
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.allow-opaque-token-introspection=false
quarkus.oidc.token.require-jwt-introspection-only=false

# /q/* stays open for in-network probes.
# One GET is public: OAuth protected-resource metadata. It is not /autonomy/mcp.
# Every other path, including /autonomy/mcp, requires a caller.
quarkus.http.auth.permission.public.paths=/q/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.metadata.paths=/api/autonomy/oauth-protected-resource
quarkus.http.auth.permission.metadata.policy=mcp-metadata
quarkus.http.auth.permission.metadata.methods=GET
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# MCP session ids are Redis keys freedriver:mcp:autonomy: and expire after 24 hours.
freedriver.redis.url=${FREEDRIVER_REDIS_URL:redis://redis:6379}

# Off unless compose turns it on. Live-commands stays a dashboard setting.
freedriver.mcp.enabled=false
freedriver.mcp.dashboard-url=http://dashboard:8080
freedriver.mcp.internal-secret=${FREEDRIVER_MCP_INTERNAL_SECRET:}
freedriver.mcp.tool-rate-limit.permits=30
freedriver.mcp.tool-rate-limit.window=60s

%dev.quarkus.oidc.enabled=false
%dev.freedriver.mcp.enabled=true

%test.quarkus.oidc.enabled=false
%test.freedriver.mcp.enabled=true
%test.freedriver.mcp.internal-secret=test-internal-secret
%test.freedriver.mcp.tool-rate-limit.permits=8
%test.freedriver.mcp.tool-rate-limit.window=60s
%test.quarkus.http.test-port=0
