# JAX-RS interfaces and @RolesAllowed live in agent-dispatcher-api. Index that jar
# or Quarkus misses the security annotations at build time.
quarkus.index-dependency.agent-dispatcher-api.group-id=io.freedriver
quarkus.index-dependency.agent-dispatcher-api.artifact-id=agent-dispatcher-api

# Bearer resource server. Keycloak is the issuer. Leave quarkus.oidc.enabled=false
# until scripts/provision-keycloak-freedriver.sh has been applied.
quarkus.oidc.enabled=false
quarkus.keycloak.devservices.enabled=false
quarkus.oidc.devservices.enabled=false
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=https://auth.freedriver.io/realms/freedriver
quarkus.oidc.client-id=freedriver-dispatcher
quarkus.oidc.credentials.secret=${FREEDRIVER_DISPATCHER_OIDC_SECRET:}
quarkus.oidc.roles.source=accesstoken

# /q/* stays open for in-network probes.
# One GET is public: OAuth protected-resource metadata. It is not /mcp.
# Every other path, including /mcp, requires a caller. Role checks stay on the JAX-RS interface.
quarkus.http.auth.permission.public.paths=/q/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.metadata.paths=/api/dispatcher/oauth-protected-resource
quarkus.http.auth.permission.metadata.policy=mcp-metadata
quarkus.http.auth.permission.metadata.methods=GET
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# In-memory queue. submit_job returns when every assignment is terminal or this elapses.
freedriver.dispatcher.submit-timeout=75s
freedriver.dispatcher.poll-timeout=25s

%dev.quarkus.oidc.enabled=false

# Tests use @TestSecurity with quarkus.oidc.enabled=false. Short waits so the deadline test finishes.
%test.quarkus.oidc.enabled=false
%test.freedriver.dispatcher.submit-timeout=300ms
%test.freedriver.dispatcher.poll-timeout=300ms
%test.quarkus.http.test-port=0
