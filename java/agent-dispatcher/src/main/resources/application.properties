# Bearer resource server. Keycloak is the issuer. Prod turns OIDC on; default, dev,
# and test stay off so the app starts locally with no secrets.
quarkus.oidc.enabled=false
%prod.quarkus.oidc.enabled=true
quarkus.keycloak.devservices.enabled=false
quarkus.oidc.devservices.enabled=false
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=https://auth.freedriver.io/realms/freedriver
quarkus.oidc.client-id=freedriver-dispatcher
quarkus.oidc.credentials.secret=${FREEDRIVER_DISPATCHER_OIDC_SECRET:}
quarkus.oidc.roles.source=accesstoken
# Do not pin a single azp. grok.com and the host are different clients.
# AllowedClientFilter pairs each client id with one role.
# Leave the access-token audience check unset so Keycloak's default
# aud=account is not treated as a client pin.
freedriver.dispatcher.client.dispatcher=freedriver-dispatcher
freedriver.dispatcher.client.device=freedriver-openbot
# The portal's service account (Keycloak client freedriver-portal-jobs) reads /api/dispatcher/admin/jobs
# with realm role dispatcher-admin and nothing else.
freedriver.dispatcher.client.portal=freedriver-portal-jobs
quarkus.tls.trust-all=false
# Empty FREEDRIVER_DISPATCHER_OIDC_SECRET must not switch this service onto
# shared-secret introspection. JWKS + iss/exp/nbf only.
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.allow-opaque-token-introspection=false
quarkus.oidc.token.require-jwt-introspection-only=false

# /q/* stays open for in-network probes.
# One GET is public: OAuth protected-resource metadata. It is not /mcp.
# Every other path, including /mcp, requires a caller. Role checks stay on the tools.
quarkus.http.auth.permission.public.paths=/q/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.metadata.paths=/api/dispatcher/oauth-protected-resource
quarkus.http.auth.permission.metadata.policy=mcp-metadata
quarkus.http.auth.permission.metadata.methods=GET
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Quarkus MCP server. /mcp and /dispatch/mcp expose the same tools.
quarkus.mcp.server.server-info.name=freedriver-dispatcher
quarkus.mcp.server.server-info.version=1.0.0
quarkus.mcp.server.http.root-path=/mcp
quarkus.mcp.server.dispatch.server-info.name=freedriver-dispatcher
quarkus.mcp.server.dispatch.server-info.version=1.0.0
quarkus.mcp.server.dispatch.http.root-path=/dispatch/mcp
# A constraint on a tool argument answers as a JSON-RPC invalid-params error, as the hand checks did.
quarkus.mcp.server.tools.input-validation-error=protocol
quarkus.mcp.server.dispatch.tools.input-validation-error=protocol

# mcp-support: protected-resource metadata, the bearer challenge, and the session-to-subject binding.
freedriver.mcp.resource=https://app.freedriver.io/dispatch/mcp
freedriver.mcp.authorization-servers=https://auth.freedriver.io/realms/freedriver
freedriver.mcp.metadata-path=/api/dispatcher/oauth-protected-resource
freedriver.mcp.paths=/mcp,/dispatch/mcp
freedriver.mcp.roles=dispatcher,device
# MCP session bindings are Redis keys freedriver:mcp:dispatcher: and expire after 24 hours.
freedriver.mcp.session-prefix=freedriver:mcp:dispatcher:
# One managed Redis client (quarkus-redis-client). Production uses the compose Redis host; it is not
# a public port. Dev and test start a Redis container through Dev Services, on the compose image tag.
%prod.quarkus.redis.hosts=${FREEDRIVER_REDIS_URL:redis://redis:6379}
quarkus.redis.devservices.image-name=redis:7.4-alpine

# Mongo is the queue. The REST submit returns when every assignment is terminal or this elapses.
freedriver.dispatcher.submit-timeout=75s
freedriver.dispatcher.poll-timeout=25s
# Signed POST to the OpenBot dispatch-jobs routine. Empty skips the POST. The prompt is not sent.
freedriver.dispatcher.openbot-webhook-secret=${FREEDRIVER_DISPATCHER_OPENBOT_WEBHOOK_SECRET:}
# Own database (#505). JobStoreService writes agent-jobs, agent-devices, and agent-locks.
# A short selection wait keeps a down database from holding submit for the driver default.
# Dev and test start a Mongo container through Dev Services, on the compose image tag.
quarkus.mongodb.devservices.enabled=false
%dev.quarkus.mongodb.devservices.enabled=true
%test.quarkus.mongodb.devservices.enabled=true
quarkus.mongodb.devservices.image-name=mongo:8.0
# Same workaround as the compose service: without it mongo:8.0 exits before it accepts
# connections on the CI kernel.
quarkus.mongodb.devservices.container-env.GLIBC_TUNABLES=glibc.pthread.rseq=1
quarkus.mongodb.server-selection-timeout=2S
quarkus.mongodb.database=freedriver_dispatcher

%dev.quarkus.oidc.enabled=false

# Tests use @TestSecurity with quarkus.oidc.enabled=false. Short waits so the deadline test finishes.
%test.quarkus.oidc.enabled=false
%test.freedriver.dispatcher.submit-timeout=300ms
%test.freedriver.dispatcher.poll-timeout=300ms
%test.quarkus.http.test-port=0
