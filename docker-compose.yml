services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - /opt/freedriver-storage/caddy/data:/data
      - /opt/freedriver-storage/caddy/config:/config
    depends_on:
      - keycloak
      - app
      - grafana

  app:
    build:
      context: .
      dockerfile: app/src/main/docker/Dockerfile.compose
      args:
        BUILD_NUMBER: ${BUILD_NUMBER:-1.0.0-SNAPSHOT}
    restart: unless-stopped
    environment:
      QUARKUS_OIDC_AUTH_SERVER_URL: https://auth.freedriver.io/realms/freedriver
      QUARKUS_OIDC_CLIENT_ID: freedriver-api
      QUARKUS_OIDC_CREDENTIALS_SECRET: ${QUARKUS_OIDC_CREDENTIALS_SECRET:?QUARKUS_OIDC_CREDENTIALS_SECRET is required}
    expose:
      - "8080"

  keycloak:
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    pull_policy: build
    restart: unless-stopped
    command: start
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD is required}
      KC_HOSTNAME: https://auth.freedriver.io
      KC_HOSTNAME_ADMIN: http://127.0.0.1:8081
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_CACHE: local
      # Shared secret the phone OTP SPI sends to http://sms:8080.
      SMS_OTP_SHARED_SECRET: ${SMS_OTP_SHARED_SECRET:-}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD is required}
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD is required}
    volumes:
      - /opt/freedriver-storage/keycloak-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Internal OTP service. Keycloak calls http://sms:8080 on the compose
  # network. HTTP contract and limits: docs/sms-otp.md.
  sms:
    build:
      context: ./sms/stub
    pull_policy: build
    restart: unless-stopped
    environment:
      SMS_OTP_SHARED_SECRET: ${SMS_OTP_SHARED_SECRET:-}
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  grafana:
    image: grafana/grafana:13.1.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
      GF_SERVER_ROOT_URL: http://127.0.0.1:3000
      GF_SERVER_DOMAIN: 127.0.0.1
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - /opt/freedriver-storage/grafana:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 384m
    depends_on:
      - loki
      - prometheus

  loki:
    image: grafana/loki:3.7.6
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
      - -target=all
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - /opt/freedriver-storage/loki:/loki
    expose:
      - "3100"
    mem_limit: 512m
    environment:
      GOMEMLIMIT: 400MiB

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=:9090
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/freedriver-storage/prometheus:/prometheus
    expose:
      - "9090"
    mem_limit: 256m

  alloy:
    image: grafana/alloy:v1.18.1
    restart: unless-stopped
    user: "0"
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "12345"
    mem_limit: 192m
    environment:
      GOMEMLIMIT: 150MiB
    depends_on:
      - loki

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # Holds passwd, acl, server.crt and server.key for mosquitto.conf.
      - /opt/freedriver-secrets/mosquitto:/mosquitto/config/secrets:ro
      - /opt/freedriver-storage/mosquitto:/mosquitto/data

  # Watches Caddy's on-disk mqtt.freedriver.io certificate, copies it over
  # Mosquitto's server.{crt,key}, and sends SIGHUP to mosquitto in the shared
  # PID namespace (scripts/sync-mosquitto-le-cert.sh). Mosquitto also reads the
  # files on start. Techops reloads by hand with
  # `docker compose --env-file /opt/freedriver-secrets/.env kill -s HUP mosquitto`.
  mosquitto-cert-sync:
    build:
      context: ./scripts
      dockerfile: mosquitto-cert-sync.Dockerfile
    restart: unless-stopped
    user: "0"
    pid: "service:mosquitto"
    environment:
      CADDY_CERTS: /caddy-data/caddy/certificates
      DEST_DIR: /mosquitto-secrets
      DOMAIN: mqtt.freedriver.io
    volumes:
      - ./scripts/sync-mosquitto-le-cert.sh:/usr/local/bin/sync-mosquitto-le-cert.sh:ro
      - /opt/freedriver-storage/caddy/data:/caddy-data:ro
      - /opt/freedriver-secrets/mosquitto:/mosquitto-secrets
    depends_on:
      - caddy
      - mosquitto
    mem_limit: 64m
