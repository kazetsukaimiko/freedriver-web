# ArchUnit for the API quality gate (#741). The frozen violations live in archunit-store; only a
# new violation fails. The store is recorded on Java 23, the CI JDK, and the tests read it without
# creating or rewriting it.
freeze.store.default.path=src/test/resources/archunit-store
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=false
freeze.refreeze=false
