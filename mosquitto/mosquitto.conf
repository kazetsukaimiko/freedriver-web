# MQTTS only. No plaintext 1883 listener. No WebSockets.
listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/secrets/passwd
# Live ACL is the secrets file (already bind-mounted). Do not mount the
# git template (mosquitto/acl.template) over the broker ACL.
acl_file /mosquitto/config/secrets/acl
certfile /mosquitto/config/secrets/server.crt
keyfile /mosquitto/config/secrets/server.key
persistence true
persistence_location /mosquitto/data/
log_dest stdout
