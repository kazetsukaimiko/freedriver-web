# Two sockets. Mosquitto has no SNI, so each listener presents one certificate.
# Dynamic security applies to both listeners. Do not set per_listener_settings
# or listener_allow_anonymous. Do not set password_file or acl_file.
allow_anonymous false
persistence true
persistence_location /mosquitto/data/
# retain_available false refuses retained PUBLISH messages. Reloaded on SIGHUP.
retain_available false
log_dest stdout

# eclipse-mosquitto:2.1.2-alpine installs the plugin at this path.
plugin /usr/lib/mosquitto_dynamic_security.so
# Writable data volume. mosquitto_ctrl dynsec init creates this file before
# the broker starts, with an admin username that is not "admin".
# A missing file must not mint that built-in admin user. The password-init
# path is never created by this repo, so that init fails and writes nothing.
plugin_opt_config_file /mosquitto/data/dynamic-security.json
plugin_opt_password_init_file /mosquitto/config/secrets/dynsec-password-init

# Unpublished. The API dials hostname mosquitto port 8883.
# SAN is DNS:mosquitto only. Not server.crt; cert-sync must not overwrite it.
listener 8883
protocol mqtt
certfile /mosquitto/config/secrets/internal.crt
keyfile /mosquitto/config/secrets/internal.key

# Public listener. Compose publishes host 8883 to this port.
# Let's Encrypt DNS:mqtt.freedriver.io only, via server.crt and server.key.
listener 8884
protocol mqtt
certfile /mosquitto/config/secrets/server.crt
keyfile /mosquitto/config/secrets/server.key
