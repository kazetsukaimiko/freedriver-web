# One listener: MQTT over TLS on port 8883.
listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/secrets/passwd
# Live ACL, written by scripts/provision-mosquitto.sh from mosquitto/acl.template.
acl_file /mosquitto/config/secrets/acl
certfile /mosquitto/config/secrets/server.crt
keyfile /mosquitto/config/secrets/server.key
persistence true
persistence_location /mosquitto/data/
# Retained PUBLISH is refused. A message already in the persistence db
# is delivered until it is cleared while retain is allowed. Reloaded on SIGHUP.
retain_available false
log_dest stdout
