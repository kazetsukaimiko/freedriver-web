# MQTTS only. No plaintext 1883 listener. No WebSockets.
listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/secrets/passwd
acl_file /mosquitto/config/acl
certfile /mosquitto/config/secrets/server.crt
keyfile /mosquitto/config/secrets/server.key
persistence true
persistence_location /mosquitto/data/
log_dest stdout
