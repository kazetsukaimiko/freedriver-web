# Two sockets. Mosquitto has no SNI, so each listener presents one certificate.
# allow_anonymous, password_file, and acl_file apply to both listeners.
# Do not set per_listener_settings or listener_allow_anonymous.
allow_anonymous false
password_file /mosquitto/config/secrets/passwd
# Live ACL, written by scripts/provision-mosquitto.sh from mosquitto/acl.template.
acl_file /mosquitto/config/secrets/acl
persistence true
persistence_location /mosquitto/data/
# retain_available false refuses retained PUBLISH messages. Reloaded on SIGHUP.
retain_available false
log_dest stdout

# Unpublished. The API dials hostname mosquitto port 8883.
# SAN is DNS:mosquitto only. Not server.crt; cert-sync must not overwrite it.
listener 8883
protocol mqtt
certfile /mosquitto/config/secrets/internal.crt
keyfile /mosquitto/config/secrets/internal.key

# Public listener. Compose publishes host 8883 to this port.
# Let's Encrypt DNS:mqtt.freedriver.io only, via server.crt and server.key.
listener 8884
protocol mqtt
certfile /mosquitto/config/secrets/server.crt
keyfile /mosquitto/config/secrets/server.key
